<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dotverse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --bg:#fff; --ink:#14181f; --muted:#6b7280; --line:#e7e9ee; --dot:#3d5afe; --dot-soft:#eef0ff; --danger:#e14b4b; }
  *{box-sizing:border-box;} html,body{height:100%;margin:0;font-family:"Tahoma","Arial",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
  .hidden{display:none!important;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  
  /* Auth */
  .auth-wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;overflow-y:auto;}
  .auth-card{width:100%;max-width:380px;border:1px solid var(--line);border-radius:14px;padding:32px 28px;background:#fff;box-shadow:0 12px 32px -12px rgba(0,0,0,.1);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand-dot{width:14px;height:14px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 4px var(--dot-soft);}
  .brand-name{font-size:20px;font-weight:700;}
  .auth-sub{color:var(--muted);font-size:13.5px;margin:0 0 24px;}
  .tabs{display:flex;gap:4px;margin-bottom:20px;background:#f4f5f7;border-radius:10px;padding:3px;}
  .tab{flex:1;text-align:center;padding:8px 0;font-size:13.5px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--muted);}
  .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);}
  label.field{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 6px;}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;outline:none;background:#fbfbfc;font-family:inherit;}
  input:focus,select:focus{border-color:var(--dot);background:#fff;}
  .btn{padding:12px 0;border:none;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:700;width:100%;background:var(--dot);color:#fff;margin-top:20px;font-family:inherit;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;background:#f4f5f7;color:var(--ink);width:auto;margin:0;}
  .btn-danger{background:#ef4444;color:#fff;}
  .auth-msg{font-size:13px;margin-top:12px;min-height:16px;color:var(--danger);}

  /* Shell */
  #app{height:100%; display:flex; flex-direction:column;}
  #shell{display:flex;flex-direction:column;height:100%;overflow:hidden;}
  #topbar-mobile{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0;overflow-x:auto;}
  .topbar-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px;cursor:pointer;color:var(--muted);min-width:52px;}
  .topbar-btn .tb-icon{font-size:18px;}
  .topbar-btn .tb-label{font-size:8.5px;font-weight:700;}
  .topbar-btn.hidden{display:none;}
  
  #main{flex:1;display:flex;flex-direction:column;min-height:0;}
  #room-header{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
  #room-header .rtitle{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
  #room-header .rscore{font-size:12px;color:var(--muted);}
  
  #messages{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:0;}
  .msg{display:flex;gap:8px;align-items:flex-start;}
  .avatar-emoji{font-size:16px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--dot-soft);border-radius:50%;flex-shrink:0;cursor:pointer;overflow:hidden;}
  .avatar-img{width:100%;height:100%;object-fit:cover;}
  .msg-body{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .msg-name{font-size:13px;font-weight:700;cursor:pointer;}
  .msg-text{font-size:14px;word-break:break-word;}
  .sys-msg{text-align:center;color:var(--muted);font-size:12px;font-style:italic;margin:5px 0;}
  
  #composer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-shrink:0;}
  #composer input{flex:1;font-family:inherit;}
  #composer button{padding:0 20px;margin:0;width:auto;}

  /* Modals & Menus */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;overflow-y:auto;}
  .modal-card{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:380px;max-height:86vh;overflow-y:auto;box-sizing:border-box;}
  .modal-card.wide{max-width:600px;}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-weight:700;}
  .list-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f4f5f7;font-size:13px;cursor:pointer;}
  .ctx-menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.2);padding:6px;z-index:90;min-width:180px;}
  .ctx-item{padding:9px 12px;font-size:13px;font-weight:600;border-radius:7px;cursor:pointer;}
  .ctx-item:hover{background:#f4f5f7;}
  
  /* Profile Styles */
  .p-row{display:flex;align-items:center;border-bottom:1px solid #f4f5f7;padding:10px 0;min-height:40px;}
  .p-label{width:45%;font-size:13px;color:var(--muted);font-weight:600;border-right:1px solid var(--line);padding-right:10px;text-align:right;}
  .p-val{width:55%;padding-left:10px;display:flex;justify-content:flex-end;align-items:center;}
  .p-input, .p-select{width:100%;max-width:140px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:#f9f9f9;outline:none;text-align:right;font-family:inherit;}
  .p-input:focus, .p-select:focus{border-color:var(--dot);background:#fff;}
  .p-bubble{background:var(--dot-soft);color:var(--dot);padding:6px 16px;border-radius:20px;font-weight:700;font-size:13px;text-align:center;}
  .p-btn-row{display:flex;gap:10px;margin-top:20px;}
  .p-btn{flex:1;padding:10px;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
  .p-btn-save{background:var(--dot);color:#fff;}
  .p-btn-logout{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .p-color-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:140px;}
  .p-color-opt{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .p-color-opt.selected{border-color:var(--ink);}

  /* PM Popups & History */
  #pm-popup-root{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:120;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .pm-popup-card{width:fit-content;min-width:220px;max-width:320px;border:1px solid rgba(0,0,0,0.5);box-shadow:2px 3px 8px rgba(0,0,0,0.45);display:flex;flex-direction:column;background:#fff;}
  .pm-popup-header{display:flex;justify-content:space-between;align-items:center;padding:0 0 0 8px;color:#fff;font-size:14px;font-weight:bold;height:26px;}
  .pm-popup-close{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#000;}
  .pm-popup-text{padding:12px;color:#000;font-size:12px;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.4;min-height:40px;}
  .pm-popup-actions{display:flex;height:28px;}
  .pm-popup-actions button{flex:1;color:#000;border:2px outset;font-size:12px;cursor:pointer;font-family:inherit;font-weight:bold;white-space:nowrap;}
  .pm-popup-reply-box{display:flex;height:28px;}
  .pm-popup-reply-box input{flex:1;padding:4px 8px;border:1px solid #ccc;font-size:12px;outline:none;font-family:inherit;}
  .pm-popup-reply-box button{width:60px;color:#000;border:2px outset;font-size:12px;cursor:pointer;font-family:inherit;font-weight:bold;white-space:nowrap;}
  
  .pm-history-view{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;padding:10px;background:#f9f9f9;border-radius:8px;margin-bottom:16px;}
  .pm-history-msg{max-width:80%;padding:8px 12px;border-radius:8px;font-size:13px;word-break:break-word;color:#000;}
  .pm-history-msg b{font-size:10px;display:block;margin-bottom:2px;opacity:0.8;}

  /* Friends List in Modal */
  .pm-modal-tabs{display:flex;gap:4px;margin-bottom:20px;background:#f4f5f7;border-radius:10px;padding:3px;}
  .pm-modal-tab{flex:1;text-align:center;padding:8px 0;font-size:13.5px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--muted);}
  .pm-modal-tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);}
  .friend-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f4f5f7;}
  .friend-info{display:flex;align-items:center;gap:10px;}
  .friend-av{font-size:20px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--dot-soft);border-radius:50%;}
  .friend-name{font-weight:600;font-size:14px;}
  .friend-actions{display:flex;gap:4px;}
  .act-btn{border:none;background:#f4f5f7;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .act-btn.danger{background:#fee2e2;color:#ef4444;}
  .act-btn.primary{background:var(--dot);color:#fff;}
</style>
</head>
<body>

<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="brand-dot"></span><span class="brand-name">Dotverse</span></div>
    <p class="auth-sub">A tiny chat world. Ten seats. One dot at a time.</p>
    <div class="tabs">
      <div class="tab active" id="tab-login">Log in</div>
      <div class="tab" id="tab-register">Register</div>
    </div>
    <div id="form-login">
      <label class="field">Username</label><input type="text" id="login-username" />
      <label class="field">Password</label><input type="password" id="login-password" />
      <button class="btn" id="btn-login">Log in</button>
    </div>
    <div id="form-register" class="hidden">
      <label class="field">Username</label><input type="text" id="reg-username" />
      <label class="field">Password</label><input type="password" id="reg-password" />
      <label class="field">Gender</label><select id="reg-gender"><option value="male">Male</option><option value="female">Female</option></select>
      <label class="field">City</label><input type="text" id="reg-city" />
      <button class="btn" id="btn-register">Create account</button>
    </div>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<div id="shell" class="hidden">
  <div id="topbar-mobile">
    <div class="topbar-btn" id="tb-profile"><span class="tb-icon">👤</span><span class="tb-label">Profile</span></div>
    <div class="topbar-btn" id="tb-pms"><span class="tb-icon">👥</span><span class="tb-label">PMs</span></div>
    <div class="topbar-btn" id="tb-rooms"><span class="tb-icon">💬</span><span class="tb-label">Rooms</span></div>
    <div class="topbar-btn" id="tb-dots"><span class="tb-icon">🪙</span><span class="tb-label" id="tb-dots-count">0</span></div>
    <div class="topbar-btn" id="tb-games"><span class="tb-icon">🎮</span><span class="tb-label">Games</span></div>
    <div class="topbar-btn hidden" id="tb-admin"><span class="tb-icon">👑</span><span class="tb-label">Admin</span></div>
    <div class="topbar-btn" id="tb-roominfo"><span class="tb-icon">ℹ️</span><span class="tb-label">Room</span></div>
  </div>
  <div id="main">
    <div id="room-header">
      <div class="rtitle"><span id="room-title">Lobby</span><span class="rscore" id="room-meta">ID: 1</span></div>
    </div>
    <div id="messages"></div>
    <div id="composer">
      <input type="text" id="msg-input" placeholder="Say something…" maxlength="500" />
      <button class="btn btn-sm" id="btn-send">Send</button>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<div id="context-root"></div>
<div id="pm-popup-root"></div>

<script>
const SUPABASE_URL = "https://secsiftaabzbrfbaeaxn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlY3NpZnRhYWJ6YnJmYmFlYXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODY4NzIsImV4cCI6MjEwMTM2Mjg3Mn0.ZBFujtK74JZK6NsI5vGO_O733qY2rSsPmvnbBcZSxu4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_GIF = "https://secsiftaabzbrfbaeaxn.supabase.co/storage/v1/object/public/Avatars/Dot.gif";

let currentUser = null, currentRoom = 1, msgSubscription = null, pmSubscription = null;
const userCache = {}; 
const AVATARS = ["🦊","🦄","🐰","🐭","🍄","☢️","🌼","♥️","♠️","♣️","♦️","👺","👻","👽","⛄","💀","👤","🧑🏻‍🚀","🧒🏻","👩🏻","🍁","🍀","🌲","⚡","🐥","🛡️","♂️","♀️"];
const COLORS = ["#000000", "#ef4444", "#f97316", "#eab308", "#22c55e", "#06b6d4", "#3b82f6", "#8b5cf6", "#ec4899", "#6b7280", "#f5780e"];

function el(id){return document.getElementById(id);}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function showMsg(t,ok){const e=el('auth-msg');e.textContent=t;e.className='auth-msg '+(ok?'ok':'error');}

el('tab-login').onclick=()=>{el('tab-login').classList.add('active');el('tab-register').classList.remove('active');el('form-login').classList.remove('hidden');el('form-register').classList.add('hidden');showMsg('',true);};
el('tab-register').onclick=()=>{el('tab-register').classList.add('active');el('tab-login').classList.remove('active');el('form-register').classList.remove('hidden');el('form-login').classList.add('hidden');showMsg('',true);};

// --- Auth Logic ---
el('btn-register').onclick = async () => {
  const u=el('reg-username').value.trim(),p=el('reg-password').value,g=el('reg-gender').value,c=el('reg-city').value.trim();
  if(u.length < 3 || u.length > 14) return showMsg('Username must be 3-14 chars.');
  if(p.length < 3 || p.length > 14) return showMsg('Password must be 3-14 chars.');
  
  const { data, error } = await sb.from('app_users').insert([{ username: u, password: p, gender: g, city: c, currency: 10.00 }]).select().single();
  if (error) {
    if(error.message.includes('duplicate')) return showMsg('Username already exists.');
    return showMsg('Error: ' + error.message);
  }
  currentUser = data;
  startApp();
};

el('btn-login').onclick = async () => {
  const u=el('login-username').value.trim(),p=el('login-password').value;
  if(!u||!p) return showMsg('Enter credentials.');
  
  const { data, error } = await sb.from('app_users').select('*').eq('username', u).eq('password', p).single();
  if (error || !data) return showMsg('Invalid username or password.');
  currentUser = data;
  startApp();
};

// --- App Shell Logic ---
async function startApp(){
  el('auth-screen').classList.add('hidden');
  el('shell').classList.remove('hidden');
  if(currentUser.is_admin) el('tb-admin').classList.remove('hidden');
  updateTopBar();
  joinRoom(1);
  subscribeToPMs();
}

function updateTopBar(){
  el('tb-dots-count').textContent = currentUser.is_admin ? '∞' : currentUser.currency;
}

// --- Rating & Color Logic ---
function getPmColorScheme(user) {
  if (!user) return { header:'#6b7280', body:'#e5e7eb', footer:'#6b7280', close:'#9ca3af', border:'#6b7280' };
  if (user.is_admin) return { header:'linear-gradient(#a44600, #8c3d00)', body:'#ff7910', footer:'linear-gradient(#a44600, #8c3d00)', close:'#ef6500', border:'#a4600e' };
  
  let score = user.rating_points || 0;
  let gender = user.gender || 'male';
  
  if (score <= 100) return gender === 'female' ? { header:'linear-gradient(#ec4899, #db2777)', body:'#fbcfe8', footer:'linear-gradient(#ec4899, #db2777)', close:'#f9a8d4', border:'#f472b6' } : { header:'linear-gradient(#3b82f6, #2563eb)', body:'#bfdbfe', footer:'linear-gradient(#3b82f6, #2563eb)', close:'#93c5fd', border:'#60a5fa' };
  if (score <= 200) return gender === 'female' ? { header:'linear-gradient(#b91c1c, #991b1b)', body:'#f87171', footer:'linear-gradient(#b91c1c, #991b1b)', close:'#ef4444', border:'#dc2626' } : { header:'linear-gradient(#1d4ed8, #1e40af)', body:'#60a5fa', footer:'linear-gradient(#1d4ed8, #1e40af)', close:'#3b82f6', border:'#2563eb' };
  if (score <= 500) return { header:'linear-gradient(#b91c1c, #991b1b)', body:'#f87171', footer:'linear-gradient(#b91c1c, #991b1b)', close:'#ef4444', border:'#dc2626' };
  if (score <= 1000) return { header:'linear-gradient(#8b5cf6, #7c3aed)', body:'#ddd6fe', footer:'linear-gradient(#8b5cf6, #7c3aed)', close:'#c4b5fd', border:'#a78bfa' };
  if (score <= 1500) return { header:'linear-gradient(#6d28d9, #5b21b6)', body:'#c4b5fd', footer:'linear-gradient(#6d28d9, #5b21b6)', close:'#a78bfa', border:'#7c3aed' };
  if (score <= 2000) return { header:'linear-gradient(#0891b2, #0e7490)', body:'#67e8f9', footer:'linear-gradient(#0891b2, #0e7490)', close:'#22d3ee', border:'#06b6d4' };
  return { header:'linear-gradient(#e5e7eb, #d1d5db)', body:'#ffffff', footer:'linear-gradient(#e5e7eb, #d1d5db)', close:'#f3f4f6', border:'#9ca3af' };
}

// --- Chat Room Logic ---
async function joinRoom(id){
  currentRoom = id;
  closeModal();
  if (msgSubscription) await sb.removeChannel(msgSubscription);

  const { data: room } = await sb.from('rooms').select('*').eq('room_id', id).single();
  if (room) {
    el('room-title').textContent = room.name;
    el('room-meta').textContent = 'ID: ' + room.room_id + ' · ' + room.rating_points + ' pts';
  }

  await loadMessages();

  msgSubscription = sb.channel('public:public_messages:room_id=eq.' + id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'public_messages', filter: `room_id=eq.${id}` }, payload => {
      appendMessage(payload.new, true);
    })
    .subscribe();
}

async function loadMessages(){
  const { data } = await sb.from('public_messages')
    .select('*, sender:app_users(username, avatar_url, id_color, is_admin)')
    .eq('room_id', currentRoom)
    .order('created_at', { ascending: true })
    .limit(50);
  
  const w = el('messages');
  w.innerHTML = '';
  if (data) data.forEach(m => appendMessage(m, false));
  w.scrollTop = w.scrollHeight;
}

async function getUserData(userId) {
  const cached = userCache[userId];
  const now = Date.now();
  if (cached && cached._ts && (now - cached._ts < 15000)) return cached;
  const { data } = await sb.from('app_users').select('username, avatar_url, id_color, is_admin, rating_points, gender').eq('user_id', userId).single();
  userCache[userId] = data || { username: 'Unknown', avatar_url: '🙂', id_color: '#000' };
  userCache[userId]._ts = now;
  return userCache[userId];
}

async function appendMessage(m, isRealtime){
  const w = el('messages');
  const div = document.createElement('div');
  
  if (!m.user_id) { 
    div.className = 'sys-msg';
    div.textContent = m.content;
    w.appendChild(div);
    if (isRealtime) w.scrollTop = w.scrollHeight;
    return;
  }

  let uData = m.sender || m.app_users;
  if (m.user_id === currentUser.user_id) {
    uData = { username: currentUser.username, avatar_url: currentUser.avatar_url, id_color: currentUser.id_color, is_admin: currentUser.is_admin };
  } else if (!uData && m.user_id) {
    uData = await getUserData(m.user_id);
  }
  
  const username = uData ? uData.username : (m.username || 'Unknown');
  const avatarHtml = uData && uData.is_admin ? `<img src="${ADMIN_GIF}" class="avatar-img">` : (uData ? (uData.avatar_url || '🙂') : '🙂');
  const nameColor = uData ? (uData.id_color || '#000') : '#000';
  
  div.className = 'msg';
  div.innerHTML = `<span class="avatar-emoji" onclick="showCtx(event,'${username}')">${avatarHtml}</span>
                   <div class="msg-body"><span class="msg-name" style="color:${nameColor}" onclick="showCtx(event,'${username}')">${escapeHtml(username)}</span><span class="msg-text">${escapeHtml(m.content)}</span></div>`;
  w.appendChild(div);
  if (isRealtime) w.scrollTop = w.scrollHeight;
}

el('btn-send').onclick = async () => {
  const t = el('msg-input').value.trim();
  if (!t) return;
  el('msg-input').value = '';
  await sb.from('public_messages').insert([
    { room_id: currentRoom, user_id: currentUser.user_id, username: currentUser.username, content: t }
  ]);
};
el('msg-input').addEventListener('keydown', e => { if(e.key==='Enter') el('btn-send').click(); });

// --- Private Message (PM) Logic ---
function subscribeToPMs() {
  if (pmSubscription) sb.removeChannel(pmSubscription);
  pmSubscription = sb.channel('private_messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'private_messages', filter: `receiver_id=eq.${currentUser.user_id}` }, payload => {
      handleIncomingPM(payload.new);
    })
    .subscribe();
}

async function handleIncomingPM(msg) {
  const { data: sender } = await sb.from('app_users').select('*').eq('user_id', msg.sender_id).single();
  if (sender) openPMPopup(sender.username, msg.content, sender);
}

function openPMPopup(sender, text, senderData) {
  const scheme = getPmColorScheme(senderData);
  const popupId = 'pm-' + Date.now() + Math.random().toString(36).substr(2,5);
  const popup = document.createElement('div');
  popup.className = 'pm-popup-card';
  popup.id = popupId;
  popup.style.borderColor = scheme.border;
  
  let html = `
    <div class="pm-popup-header" style="background:${scheme.header};">
      <span>${escapeHtml(sender)}</span>
      <span class="pm-popup-close" style="background:${scheme.close};" onclick="document.getElementById('${popupId}').remove()">✕</span>
    </div>
    <div class="pm-popup-text" style="background:${scheme.body};">${escapeHtml(text)}</div>
    <div class="pm-popup-actions" id="actions-${popupId}">
      <button style="background:${scheme.footer}; border-color:${scheme.border};" onclick="showReplyBox('${popupId}', '${sender}')">Reply</button>
      <button style="background:${scheme.footer}; border-color:${scheme.border};" onclick="alert('Profile view coming soon!'); document.getElementById('${popupId}').remove();">About user</button>
    </div>
    <div class="pm-popup-reply-box hidden" id="reply-${popupId}">
      <input type="text" id="input-${popupId}" placeholder="Type reply..." />
      <button style="background:${scheme.footer}; border-color:${scheme.border};" onclick="sendReply('${sender}', '${popupId}')">Send</button>
    </div>`;
  popup.innerHTML = html;
  el('pm-popup-root').appendChild(popup);
}

function showReplyBox(popupId, sender) {
  document.getElementById(`actions-${popupId}`).classList.add('hidden');
  const replyBox = document.getElementById(`reply-${popupId}`);
  replyBox.classList.remove('hidden');
  const inp = document.getElementById(`input-${popupId}`);
  inp.focus();
  inp.addEventListener('keydown', e => { if(e.key==='Enter') sendReply(sender, popupId); });
}

async function sendReply(sender, popupId) {
  const inp = document.getElementById(`input-${popupId}`);
  const t = inp.value.trim();
  if(!t) return;
  const { data: receiver } = await sb.from('app_users').select('user_id').eq('username', sender).single();
  if(receiver) {
    await sb.from('private_messages').insert([{ sender_id: currentUser.user_id, receiver_id: receiver.user_id, content: t }]);
    document.getElementById(popupId).remove(); 
  } else { alert('User not found'); }
}

el('tb-pms').onclick = async () => {
  const { data: friendsData } = await sb.from('friends').select('friend_id').eq('user_id', currentUser.user_id);
  let friendsHtml = '<p style="color:var(--muted);text-align:center;font-size:13px;padding:20px 0;">No friends yet.</p>';
  
  if (friendsData && friendsData.length > 0) {
    const friendIds = friendsData.map(f => f.friend_id);
    const { data: friendsInfo } = await sb.from('app_users').select('username, user_id, avatar_url, is_admin').in('user_id', friendIds);
    if (friendsInfo && friendsInfo.length > 0) {
      friendsHtml = friendsInfo.map(f => `
        <div class="friend-row">
          <div class="friend-info">
            <span class="friend-av">${f.is_admin ? `<img src="${ADMIN_GIF}" class="avatar-img">` : (f.avatar_url||'🙂')}</span>
            <span class="friend-name">${escapeHtml(f.username)}</span>
          </div>
          <div class="friend-actions">
            <button class="act-btn danger" title="Remove Friend" onclick="removeFriend(${f.user_id}, '${escapeHtml(f.username)}')">➖</button>
            <button class="act-btn primary" title="Send PM" onclick="startNewPM('${escapeHtml(f.username)}')">💬</button>
          </div>
        </div>`).join('');
    }
  }

  openModal('👥 Private Messages',`
    <div class="pm-modal-tabs">
      <div class="pm-modal-tab active">Friends List</div>
    </div>
    <div id="pm-tab-friends">${friendsHtml}</div>
    <button class="btn" style="margin-top:16px;" onclick="startNewPM()">Start New PM</button>`);
};

window.startNewPM = async (u) => {
  if(!u) u = prompt('Enter username to send a PM:');
  if(!u) return;
  const { data: receiver } = await sb.from('app_users').select('*').eq('username', u).single();
  if (receiver) {
    openPMPopup(u, "", receiver);
    const popupId = document.querySelector('.pm-popup-card').id;
    showReplyBox(popupId, u);
  } else { alert("User not found"); }
};

window.addFriend = async (u) => {
  const { data: target } = await sb.from('app_users').select('user_id').eq('username', u).single();
  if(!target) return alert('User not found');
  await sb.from('friends').insert([{ user_id: currentUser.user_id, friend_id: target.user_id }]);
  alert('Added!');
};

window.removeFriend = async (id, name) => {
  await sb.from('friends').delete().eq('user_id', currentUser.user_id).eq('friend_id', id);
  alert('Removed!');
  el('tb-pms').click();
};

// --- Profile Logic ---
el('tb-profile').onclick = () => {
  const isMaster = currentUser.is_admin;
  let avHtml = isMaster ? `<img src="${ADMIN_GIF}" class="avatar-img">` : `<select id="p-avatar" class="p-select" onchange="window._av=this.value">${AVATARS.map(a => `<option value="${a}" ${currentUser.avatar_url===a?'selected':''}>${a}</option>`).join('')}</select>`;
  let coHtml = `<div class="p-color-grid" id="p-color-grid">${COLORS.map(c => `<span class="p-color-opt ${currentUser.id_color===c?'selected':''}" style="background:${c}" onclick="selColor('${c}', this)"></span>`).join('')}</div>`;
  let genderHtml = `<select id="p-gender" class="p-select" onchange="window._gender=this.value"><option value="male" ${currentUser.gender==='male'?'selected':''}>Male</option><option value="female" ${currentUser.gender==='female'?'selected':''}>Female</option></select>`;
  
  let verifyHtml = '';
  if (currentUser.is_verified) {
    verifyHtml = `<span class="p-bubble" style="background:#dcfce7;color:#16a34a;">Verified ✔</span>`;
  } else if (currentUser.verification_requested) {
    verifyHtml = `<span class="p-bubble" style="background:#fef9c3;color:#ca8a04;">Pending...</span>`;
  } else {
    verifyHtml = `<button class="p-btn p-btn-save" style="width:100px;font-size:12px;margin:0;" onclick="requestVerification()">Request</button>`;
  }

  openModal('👤 Your Profile',`
    <div style="max-width:320px;margin:0 auto;">
      <div class="p-row"><span class="p-label">Username</span><div class="p-val"><input type="text" id="p-username" class="p-input" value="${escapeHtml(currentUser.username)}"></div></div>
      <div class="p-row"><span class="p-label">Password</span><div class="p-val"><input type="password" id="p-password" class="p-input" placeholder="••••••"></div></div>
      <div class="p-row"><span class="p-label">Gender</span><div class="p-val">${genderHtml}</div></div>
      <div class="p-row"><span class="p-label">City</span><div class="p-val"><input type="text" id="p-city" class="p-input" value="${escapeHtml(currentUser.city||'')}"></div></div>
      <div class="p-row"><span class="p-label">Avatar</span><div class="p-val">${avHtml}</div></div>
      <div class="p-row"><span class="p-label">Name color</span><div class="p-val">${coHtml}</div></div>
      <div class="p-row"><span class="p-label">Verify ID</span><div class="p-val">${verifyHtml}</div></div>
      <div class="p-row" style="border-bottom:none;"><span class="p-label">ID Number</span><div class="p-val"><span class="p-bubble">#${currentUser.user_id}</span></div></div>
      
      <div class="p-btn-row">
        <button class="p-btn p-btn-logout" onclick="location.reload()">Logout</button>
        <button class="p-btn p-btn-save" onclick="saveProfile()">Save Changes</button>
      </div>
    </div>`);
  window._av = currentUser.avatar_url || '🙂'; 
  window._co = currentUser.id_color || '#000000'; 
  window._gender = currentUser.gender || 'male';
};

window.requestVerification = async () => {
  const { data, error } = await sb.from('app_users').update({ verification_requested: true }).eq('user_id', currentUser.user_id).select().single();
  if(!error) {
    currentUser = data;
    alert('Request sent to Admin!');
    el('tb-profile').click();
  }
};

window.selColor = (c, e) => {
  window._co = c;
  e.parentElement.querySelectorAll('.p-color-opt').forEach(x => x.classList.remove('selected'));
  e.classList.add('selected');
};

window.saveProfile = async () => {
  let finalAvatar = window._av;
  if(currentUser.is_admin) finalAvatar = ADMIN_GIF;
  
  const newUsername = el('p-username').value.trim();
  const newPassword = el('p-password').value;
  
  if(newUsername.length < 3 || newUsername.length > 14) return alert('Username must be 3-14 chars.');
  if(newPassword && (newPassword.length < 3 || newPassword.length > 14)) return alert('Password must be 3-14 chars.');

  const updates = {
    username: newUsername,
    gender: window._gender,
    city: el('p-city').value.trim(),
    id_color: window._co,
    avatar_url: finalAvatar
  };
  
  if(newPassword) updates.password = newPassword;

  const { data, error } = await sb.from('app_users').update(updates).eq('user_id', currentUser.user_id).select().single();
  
  if(error) {
    if(error.message.includes('duplicate')) return alert('Username already exists.');
    return alert('Error: ' + error.message);
  }
  
  currentUser = data;
  userCache[currentUser.user_id] = { username: currentUser.username, avatar_url: currentUser.avatar_url, id_color: currentUser.id_color, _ts: Date.now() };
  
  updateTopBar();
  alert('Saved successfully!');
  closeModal();
};

  const { data } = await sb.from('rooms').select('*').order('rating_points', { ascending: false });
  let rows = '';
  data.forEach(r => {
    const icon = r.room_id === 1 ? '💬' : r.room_id === 2 ? '⭐' : r.room_id === 3 ? '🚫' : '🏠';
    rows += `<div class="list-row" onclick="joinRoom(${r.room_id})"><span>${icon}</span><span style="flex:1;font-weight:600;">${escapeHtml(r.name)}</span><span style="color:var(--muted)">${r.rating_points} pts</span></div>`;
  });
  openModal('Chat Rooms', rows);
};

el('tb-dots').onclick = () => { openModal('Dots', '<p style="text-align:center;color:var(--muted)">Dots transfer will be added next.</p>'); };
el('tb-games').onclick = () => { openModal('Games', '<p style="text-align:center;color:var(--muted)">Games will be added next.</p>'); };
el('tb-roominfo').onclick = () => { openModal('Room Info', '<p style="text-align:center;color:var(--muted)">Room info will be added next.</p>'); };

function openModal(t,b,wide){el('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-card ${wide?'wide':''}"><span class="close-x" onclick="closeModal()">✕</span><h3 style="margin:0 0 16px;font-size:16px;">${t}</h3>${b}</div></div>`;}
function closeModal(){el('modal-root').innerHTML='';}

function showCtx(e,u){
  e.stopPropagation();
  const m=document.createElement('div');
  m.className='ctx-menu';
  m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';
  m.innerHTML=`
    <div class="ctx-item" onclick="startNewPM('${u}');closeCtx();">💬 Private Message</div>
    <div class="ctx-item" onclick="alert('Profile view coming soon!');closeCtx();">👤 View Profile</div>
    <div class="ctx-item" onclick="addFriend('${u}');closeCtx();">➕ Add Friend</div>
    <div class="ctx-item" onclick="alert('Dots transfer coming soon!');closeCtx();">🪙 Send Dots</div>`;
  el('context-root').innerHTML='';el('context-root').appendChild(m);
}
function closeCtx(){el('context-root').innerHTML='';}
window.onclick=closeCtx;
</script>
