<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dotverse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --bg:#fff; --ink:#14181f; --muted:#6b7280; --line:#e7e9ee; --dot:#3d5afe; --dot-soft:#eef0ff; --danger:#e14b4b; }
  *{box-sizing:border-box;} html,body{height:100%;margin:0;font-family:"Tahoma","Arial",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
  .hidden{display:none!important;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  
  /* Auth & Main UI */
  .auth-wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;overflow-y:auto;}
  .auth-card{width:100%;max-width:380px;border:1px solid var(--line);border-radius:14px;padding:32px 28px;background:#fff;box-shadow:0 12px 32px -12px rgba(0,0,0,.1);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;} .brand-dot{width:14px;height:14px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 4px var(--dot-soft);}
  .brand-name{font-size:20px;font-weight:700;} .auth-sub{color:var(--muted);font-size:13.5px;margin:0 0 24px;}
  .tabs{display:flex;gap:4px;margin-bottom:20px;background:#f4f5f7;border-radius:10px;padding:3px;} .tab{flex:1;text-align:center;padding:8px 0;font-size:13.5px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--muted);} .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);}
  label.field{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 6px;}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;outline:none;background:#fbfbfc;font-family:inherit;}
  input:focus,select:focus{border-color:var(--dot);background:#fff;}
  .btn{padding:12px 0;border:none;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:700;width:100%;background:var(--dot);color:#fff;margin-top:20px;font-family:inherit;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;background:#f4f5f7;color:var(--ink);width:auto;margin:0;}
  .btn-danger{background:#ef4444;color:#fff;} .auth-msg{font-size:13px;margin-top:12px;min-height:16px;color:var(--danger);}

  /* Shell */
  #app{height:100%; display:flex; flex-direction:column;} #shell{display:flex;flex-direction:column;height:100%;overflow:hidden;}
  #topbar-mobile{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0;overflow-x:auto;}
  .topbar-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:12px 4px;cursor:pointer;color:var(--muted);min-width:45px;}
  .topbar-btn .tb-icon{font-size:20px;} .topbar-btn .tb-label{display:none;} .topbar-btn.hidden{display:none;}
  
  #main{flex:1;display:flex;flex-direction:column;min-height:0;}
  #broadcast-root{background:#fffae6; color:#b45309; text-align:center; padding:8px 15px; font-size:12.5px; border-bottom:1px solid var(--line); font-weight:600;}
  #room-header{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
  #room-header .rtitle{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;} #room-header .rscore{font-size:12px;color:var(--muted);}
  
  #messages{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:0;}
  .msg{display:flex;gap:8px;align-items:flex-start;}
  .avatar-emoji{font-size:16px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--dot-soft);border-radius:50%;flex-shrink:0;cursor:pointer;overflow:hidden;}
  .avatar-img{width:100%;height:100%;object-fit:cover;}
  .msg-body{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;} .msg-name{font-size:13px;font-weight:700;cursor:pointer;} .msg-text{font-size:14px;word-break:break-word;}
  .sys-msg{text-align:center;color:var(--muted);font-size:12px;font-style:italic;margin:5px 0;}
  
  #composer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-shrink:0;} #composer input{flex:1;font-family:inherit;} #composer button{padding:0 20px;margin:0;width:auto;}

  /* Modals & Menus */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;overflow-y:auto;}
  .modal-card{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:380px;max-height:86vh;overflow-y:auto;box-sizing:border-box;}
  .modal-card.wide{max-width:600px;} .close-x{float:right;cursor:pointer;color:var(--muted);font-weight:700;}
  .list-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f4f5f7;font-size:13px;cursor:pointer;}
  .ctx-menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.2);padding:6px;z-index:90;min-width:180px;}
  .ctx-item{padding:9px 12px;font-size:13px;font-weight:600;border-radius:7px;cursor:pointer;} .ctx-item:hover{background:#f4f5f7;}
  
  /* Admin Panel Bubbles */
  .admin-bubble{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:15px;}
  .admin-bubble-title{font-size:14px;font-weight:bold;margin-bottom:10px;color:var(--ink);display:flex;align-items:center;gap:6px;}
  .admin-bubble-row{display:flex;gap:8px;margin-bottom:8px;}
  .admin-bubble input{padding:8px;border-radius:6px;border:1px solid var(--line);font-size:13px;background:#fff;text-align:center;}
  .admin-bubble button{padding:8px 12px;background:var(--dot);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-weight:bold;white-space:nowrap;}
  .admin-bubble button.danger{background:#ef4444;}
  .admin-bubble button.success{background:#16a34a;}
  
  /* Profile & Lists */
  .p-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f4f5f7;padding:10px 0;min-height:40px;}
  .p-label{width:45%;font-size:13px;color:var(--muted);font-weight:600;border-right:1px solid var(--line);padding-right:10px;text-align:left;}
  .p-val{width:55%;padding-left:10px;display:flex;justify-content:flex-end;align-items:center;}
  .p-input, .p-select{width:100%;max-width:140px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:#f9f9f9;outline:none;text-align:right;font-family:inherit;}
  .p-bubble{background:var(--dot-soft);color:var(--dot);padding:6px 16px;border-radius:20px;font-weight:700;font-size:13px;text-align:center;}
  .p-btn-row{display:flex;gap:10px;margin-top:20px;} .p-btn{flex:1;padding:10px;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
  .p-btn-save{background:var(--dot);color:#fff;} .p-btn-logout{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .p-color-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:140px;} .p-color-opt{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;} .p-color-opt.selected{border-color:var(--ink);}

  /* Classic Small PM Popups */
  #pm-popup-root{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:120;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .pm-popup-card{width:287px;box-shadow:2px 3px 8px rgba(0,0,0,0.45);display:flex;flex-direction:column;background:#fff;font-family:"Tahoma","Arial",sans-serif;}
  .pm-popup-header{height:23px;font-size:14px;padding:0 4px 0 0;display:flex;justify-content:space-between;align-items:center;direction:ltr;}
  .pm-popup-header span:first-child{padding-left:8px;display:flex;align-items:center;gap:4px;font-weight:bold;} .pm-popup-header img{width:16px;height:16px;border-radius:50%;vertical-align:middle;}
  .pm-popup-close{width:20px;height:23px;text-align:center;line-height:23px;font-weight:bold;font-size:13px;cursor:pointer;}
  .pm-popup-text{min-height:43px;font-size:11.5px;text-align:center;display:flex;align-items:center;justify-content:center;padding:0 8px;line-height:1.25;direction:ltr;}
  .pm-popup-actions{display:flex;height:26px;} .pm-popup-actions button{flex:1;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:bold;border:2px outset;} .pm-popup-actions button:active{border-style:inset;}
  .pm-popup-reply-box{display:flex;height:26px;} .pm-popup-reply-box input{flex:1;padding:2px 4px;border:none;font-size:12px;outline:none;font-family:inherit;background:#fff;} .pm-popup-reply-box button{width:60px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:bold;border:2px outset;}
  
  .pm-history-view{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;padding:10px;background:#f9f9f9;border-radius:8px;margin-bottom:16px;}
  .pm-history-msg{max-width:80%;padding:8px 12px;border-radius:8px;font-size:13px;word-break:break-word;color:#000;}

  /* Tabs & Lists */
  .pm-modal-tabs{display:flex;gap:4px;margin-bottom:20px;background:#f4f5f7;border-radius:10px;padding:3px;} .pm-modal-tab{flex:1;text-align:center;padding:8px 0;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--muted);} .pm-modal-tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);}
  .friend-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f4f5f7;}
  .friend-info{display:flex;align-items:center;gap:10px;} .friend-av{font-size:20px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--dot-soft);border-radius:50%;overflow:hidden;}
  .friend-name{font-weight:600;font-size:14px;} .friend-actions{display:flex;gap:4px;}
  .act-btn{border:none;background:#f4f5f7;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .act-btn.danger{background:#fee2e2;color:#ef4444;} .act-btn.primary{background:var(--dot);color:#fff;}
  .lb-rank{width:24px; height:24px; background:var(--dot); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:bold;}
</style>
</head>
<body>

<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="brand-dot"></span><span class="brand-name">Dotverse</span></div>
    <p class="auth-sub">A tiny chat world. Ten seats. One dot at a time.</p>
    <div class="tabs"><div class="tab active" id="tab-login">Log in</div><div class="tab" id="tab-register">Register</div></div>
    <div id="form-login"><label class="field">Username</label><input type="text" id="login-username" /><label class="field">Password</label><input type="password" id="login-password" /><button class="btn" id="btn-login">Log in</button></div>
    <div id="form-register" class="hidden"><label class="field">Username</label><input type="text" id="reg-username" /><label class="field">Password</label><input type="password" id="reg-password" /><label class="field">Gender</label><select id="reg-gender"><option value="male">Male</option><option value="female">Female</option></select><label class="field">City</label><input type="text" id="reg-city" /><button class="btn" id="btn-register">Create account</button></div>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<div id="shell" class="hidden">
  <div id="topbar-mobile">
    <div class="topbar-btn" id="tb-profile"><span class="tb-icon">👤</span><span class="tb-label">Profile</span></div>
    <div class="topbar-btn" id="tb-pms"><span class="tb-icon">👥</span><span class="tb-label">Community</span></div>
    <div class="topbar-btn" id="tb-rooms"><span class="tb-icon">💬</span><span class="tb-label">Rooms</span></div>
    <div class="topbar-btn" id="tb-dots"><span class="tb-icon">🪙</span><span class="tb-label">Dots</span></div>
    <div class="topbar-btn" id="tb-search"><span class="tb-icon">🔍</span><span class="tb-label">Search</span></div>
    <div class="topbar-btn hidden" id="tb-admin"><span class="tb-icon">🛡️</span><span class="tb-label">Admin</span></div>
    <div class="topbar-btn" id="tb-roominfo"><span class="tb-icon">ℹ️</span><span class="tb-label">Room</span></div>
  </div>
  <div id="main">
    <div id="broadcast-root" class="hidden"></div>
    <div id="room-header"><div class="rtitle"><span id="room-title">Lobby</span><span class="rscore" id="room-meta">ID: 1</span></div></div>
    <div id="messages"></div>
    <div id="composer"><input type="text" id="msg-input" placeholder="Say something…" maxlength="500" /><button class="btn btn-sm" id="btn-send">Send</button></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="context-root"></div>
<div id="pm-popup-root"></div>

<script>
const SUPABASE_URL = "https://secsiftaabzbrfbaeaxn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlY3NpZnRhYWJ6YnJmYmFlYXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODY4NzIsImV4cCI6MjEwMTM2Mjg3Mn0.ZBFujtK74JZK6NsI5vGO_O733qY2rSsPmvnbBcZSxu4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ADMIN_GIF = "https://secsiftaabzbrfbaeaxn.supabase.co/storage/v1/object/public/Avatars/Dot.gif";
const SM_CROWN_URL = "https://secsiftaabzbrfbaeaxn.supabase.co/storage/v1/object/public/Avatars/SM.png";

let currentUser = null, currentRoom = 1, msgSubscription = null, pmSubscription = null, broadcastSubscription = null, banCheckInterval = null;
const userCache = {}; 
const AVATARS = ["🦊","🦄","🐰","🐭","🍄","☢️","🌼","♥️","♠️","♣️","♦️","👺","👻","👽","⛄","💀","👤","🧑🏻‍🚀","🧒🏻","👩🏻","🍁","🍀","🌲","⚡","🐥","🛡️","♂️","♀️"];
const COLORS = ["#000000", "#ef4444", "#f97316", "#eab308", "#22c55e", "#06b6d4", "#3b82f6", "#8b5cf6", "#ec4899", "#6b7280", "#f5780e"];

function el(id){return document.getElementById(id);}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function showMsg(t,ok){const e=el('auth-msg');e.textContent=t;e.className='auth-msg '+(ok?'ok':'error');}

el('tab-login').onclick=()=>{el('tab-login').classList.add('active');el('tab-register').classList.remove('active');el('form-login').classList.remove('hidden');el('form-register').classList.add('hidden');showMsg('',true);};
el('tab-register').onclick=()=>{el('tab-register').classList.add('active');el('tab-login').classList.remove('active');el('form-register').classList.remove('hidden');el('form-login').classList.add('hidden');showMsg('',true);};

el('btn-register').onclick = async () => {
  const u=el('reg-username').value.trim(),p=el('reg-password').value,g=el('reg-gender').value,c=el('reg-city').value.trim();
  if(u.length < 3 || u.length > 14) return showMsg('Username must be 3-14 chars.');
  if(p.length < 3 || p.length > 14) return showMsg('Password must be 3-14 chars.');
  const { data, error } = await sb.from('app_users').insert([{ username: u, password: p, gender: g, city: c, currency: 10.00 }]).select().single();
  if (error) { if(error.message.includes('duplicate')) return showMsg('Username already exists.'); return showMsg('Error: ' + error.message); }
  currentUser = data; startApp();
};
el('btn-login').onclick = async () => {
  const u=el('login-username').value.trim(),p=el('login-password').value;
  if(!u||!p) return showMsg('Enter credentials.');
  const { data, error } = await sb.from('app_users').select('*').eq('username', u).eq('password', p).single();
  if (error || !data) return showMsg('Invalid username or password.');
  currentUser = data; startApp();
};

async function startApp(){
  el('auth-screen').classList.add('hidden'); el('shell').classList.remove('hidden');
  if(currentUser.is_admin || currentUser.is_super_mod) el('tb-admin').classList.remove('hidden');
  joinRoom(1); subscribeToPMs(); subscribeToBroadcasts(); startBanCheck();
}

function getPmColorScheme(user) {
  if (!user) return { card_border:'#6b7280', header_bg:'linear-gradient(#6b7280, #4b5563)', header_color:'#fff', close_bg:'#9ca3af', close_color:'#000', body_bg:'#e5e7eb', body_color:'#000', footer_bg:'linear-gradient(#6b7280, #4b5563)', footer_color:'#000', footer_border:'#6b7280' };
  if (user.is_admin) return { card_border:'#6b3200', header_bg:'linear-gradient(#a44600, #8c3d00)', header_color:'#fff', close_bg:'#ef6500', close_color:'#000', body_bg:'#ff7910', body_color:'#000', footer_bg:'linear-gradient(#a44600, #8c3d00)', footer_color:'#000', footer_border:'#a4600e' };
  if (user.user_id === 3 || user.is_super_mod) return { card_border:'#ca8a04', header_bg:'linear-gradient(#ca8a04, #facc15)', header_color:'#3a2f02', close_bg:'#fde047', close_color:'#3a2f02', body_bg:'#fde047', body_color:'#3a2f02', footer_bg:'linear-gradient(#ca8a04, #facc15)', footer_color:'#3a2f02', footer_border:'#ca8a04' };
  if (user.pm_color && user.pm_color_expires && new Date(user.pm_color_expires) > new Date()) {
    if (user.pm_color === 'black') return { card_border:'#000', header_bg:'linear-gradient(#3a3a3a, #000000)', header_color:'#fff', close_bg:'#5a5a5a', close_color:'#fff', body_bg:'#1a1a1a', body_color:'#fff', footer_bg:'linear-gradient(#3a3a3a, #000000)', footer_color:'#fff', footer_border:'#000' };
    if (user.pm_color === 'jade') return { card_border:'#0F3D2E', header_bg:'linear-gradient(#0F3D2E, #6ED1AC)', header_color:'#fff', close_bg:'#A8ECD0', close_color:'#0f3d2e', body_bg:'#A8ECD0', body_color:'#0f3d2e', footer_bg:'linear-gradient(#0F3D2E, #6ED1AC)', footer_color:'#fff', footer_border:'#0F3D2E' };
    if (user.pm_color === 'olive') return { card_border:'#3A3B14', header_bg:'linear-gradient(#3A3B14, #B0B25E)', header_color:'#fff', close_bg:'#D4D69C', close_color:'#2b2c10', body_bg:'#D4D69C', body_color:'#2b2c10', footer_bg:'linear-gradient(#3A3B14, #B0B25E)', footer_color:'#fff', footer_border:'#3A3B14' };
  }
  let score = user.rating_points || 0; let gender = user.gender || 'male';
  if (score <= 100) return gender === 'female' ? { card_border:'#6B1A38', header_bg:'linear-gradient(#6B1A38, #E38FAE)', header_color:'#4a0f22', close_bg:'#FBD3E0', close_color:'#4a0f22', body_bg:'#FBD3E0', body_color:'#4a0f22', footer_bg:'linear-gradient(#6B1A38, #E38FAE)', footer_color:'#4a0f22', footer_border:'#6B1A38' } : { card_border:'#1B3A66', header_bg:'linear-gradient(#1B3A66, #6FA3E0)', header_color:'#12233d', close_bg:'#C9E0FB', close_color:'#12233d', body_bg:'#C9E0FB', body_color:'#12233d', footer_bg:'linear-gradient(#1B3A66, #6FA3E0)', footer_color:'#12233d', footer_border:'#1B3A66' };
  if (score <= 200) return gender === 'female' ? { card_border:'#4A0026', header_bg:'linear-gradient(#4A0026, #A80058)', header_color:'#fff', close_bg:'#B8106A', close_color:'#fff', body_bg:'#B8106A', body_color:'#fff', footer_bg:'linear-gradient(#4A0026, #A80058)', footer_color:'#fff', footer_border:'#4A0026' } : { card_border:'#081428', header_bg:'linear-gradient(#081428, #173B72)', header_color:'#fff', close_bg:'#1B4FA0', close_color:'#fff', body_bg:'#1B4FA0', body_color:'#fff', footer_bg:'linear-gradient(#081428, #173B72)', footer_color:'#fff', footer_border:'#081428' };
  if (score <= 500) return { card_border:'#4A1216', header_bg:'linear-gradient(#4A1216, #B14A53)', header_color:'#fff', close_bg:'#C1414B', close_color:'#fff', body_bg:'#C1414B', body_color:'#fff', footer_bg:'linear-gradient(#4A1216, #B14A53)', footer_color:'#fff', footer_border:'#4A1216' };
  if (score <= 1000) return { card_border:'#33224F', header_bg:'linear-gradient(#33224F, #A98FE0)', header_color:'#2b1c47', close_bg:'#D4C4F2', close_color:'#2b1c47', body_bg:'#D4C4F2', body_color:'#2b1c47', footer_bg:'linear-gradient(#33224F, #A98FE0)', footer_color:'#2b1c47', footer_border:'#33224F' };

async function checkBanStatus() {
  if (!currentUser) return;
  const { data: u } = await sb.from('app_users').select('banned_until, ban_fine, current_room_id').eq('user_id', currentUser.user_id).single();
  if (!u) return;
  const wasBanned = new Date(currentUser.banned_until) > new Date();
  const isBannedNow = new Date(u.banned_until) > new Date();
  if (!wasBanned && isBannedNow) { currentUser.banned_until = u.banned_until; currentUser.ban_fine = u.ban_fine; alert('You have been banned!'); joinRoom(3); } 
  else if (wasBanned && !isBannedNow && currentRoom === 3) { currentUser.banned_until = u.banned_until; alert('You have been unbanned!'); joinRoom(1); } 
  else { currentUser.ban_fine = u.ban_fine; }
}

async function joinRoom(id){

    contentHtml += `<div id="admin-super_mods" class="hidden"><div class="admin-bubble"><div class="admin-bubble-title">➕ Add Super Moderator</div><div class="admin-bubble-row"><input type="number" id="sm-id" placeholder="User ID" style="flex:1;"><button class="success" onclick="adminAddSMAction()">Add</button></div></div><div id="sm-list"><p style="color:var(--muted);font-size:12px;">Loading Super Mods...</p></div></div>`;
  }

  openModal('🛡️ Admin Panel', `<div style="background:#f4f5f7; padding:10px; border-radius:8px; margin-bottom:15px; font-size:13px;"><div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>Tax Balance:</span><b>${taxBal} Ð</b></div><div style="display:flex; justify-content:space-between;"><span>Fund Balance:</span><b>${fundBal} Ð</b></div></div>${tabsHtml}${contentHtml}`);
  
  if (currentUser.is_admin) { loadAdminRequests(); loadAdminGifts(); loadAdminSMs(); }
};
window.switchAdminTab = (tab, btn) => { document.querySelectorAll('.pm-modal-tab').forEach(t => t.classList.remove('active')); btn.classList.add('active'); ['requests','users','rooms','economy','super_mods','sm_ban'].forEach(t => { const elId = `admin-${t}`; if(el(elId)) el(elId).classList.add('hidden'); }); if(el(`admin-${tab}`)) el(`admin-${tab}`).classList.remove('hidden'); };

async function loadAdminRequests() {
  const { data: reqs } = await sb.from('app_users').select('user_id, username').eq('verification_requested', true);
  let html = '<div style="font-size:14px; font-weight:bold; margin-bottom:10px;">Verify ID Requests</div>';
  if (reqs && reqs.length > 0) {
    html += reqs.map(u => `<div class="friend-row" style="cursor:default;"><div class="friend-info"><span class="friend-av">🙂</span><span class="friend-name">${escapeHtml(u.username)} (#${u.user_id})</span></div><div class="friend-actions"><button class="btn-sm" style="background:#16a34a;color:#fff;" onclick="adminVerifyAction(${u.user_id})">✔</button><button class="btn-sm" style="background:#ef4444;color:#fff;" onclick="adminRejectVerifyAction(${u.user_id})">✖</button></div></div>`).join('');
  } else { html += '<p style="color:var(--muted);font-size:12px;">No pending requests.</p>'; }
  const { data: reports } = await sb.from('private_messages').select('id, content, sender:app_users(username)').eq('receiver_id', 1).ilike('content', '🚨%').order('created_at', { ascending: false }).limit(10);
  html += '<div style="font-size:14px; font-weight:bold; margin-top:20px; margin-bottom:10px;">User Reports</div>';
  if (reports && reports.length > 0) {
    html += reports.map(r => `<div class="list-row" style="cursor:default; flex-direction:column; align-items:flex-start;"><span style="font-weight:600;">From: ${r.sender ? r.sender.username : 'Unknown'}</span><span style="font-size:12px; color:var(--muted); margin-top:4px;">${escapeHtml(r.content.replace('🚨 REPORT: ', ''))}</span></div>`).join('');
  } else { html += '<p style="color:var(--muted);font-size:12px;">No reports.</p>'; }
  if(el('admin-requests')) el('admin-requests').innerHTML = html;
}
async function loadAdminGifts() {
  const { data: gifts } = await sb.from('gifts').select('*');
  let html = gifts.map(g => `<div class="list-row" style="cursor:default;"><span class="friend-av" style="background:transparent; font-size:24px;">${g.image_url}</span><div style="flex:1; margin-left:5px;"><div style="font-weight:600; font-size:13px;">${escapeHtml(g.name)}</div><div style="font-size:11px; color:var(--muted);">${g.price} Ð | Stock: ${g.stock}</div></div><button class="btn-sm" onclick="adminEditGiftAction('${g.id}', '${escapeHtml(g.name)}')">Edit</button></div>`).join('');
  if(el('admin-gifts-list')) el('admin-gifts-list').innerHTML = html;
}
async function loadAdminSMs() {
  const { data: sms } = await sb.from('app_users').select('user_id, username, avatar_url').eq('is_super_mod', true);
  let html = '<div style="font-size:14px; font-weight:bold; margin-bottom:10px;">Current Super Mods</div>';
  if (sms && sms.length > 0) {
    html += sms.map(u => `<div class="friend-row" style="cursor:default;"><div class="friend-info"><span class="friend-av"><img src="${SM_CROWN_URL}" class="avatar-img"></span><span class="friend-name">${escapeHtml(u.username)} (#${u.user_id})</span></div><button class="btn-sm" style="background:#ef4444;color:#fff;" onclick="adminRemoveSMAction(${u.user_id})">Remove</button></div>`).join('');
  } else { html += '<p style="color:var(--muted);font-size:12px;">No Super Mods yet.</p>'; }
  if(el('sm-list')) el('sm-list').innerHTML = html;
}
window.adminVerifyAction = async (id) => { await sb.from('app_users').update({ is_verified: true, verification_requested: false }).eq('user_id', id); alert('User verified!'); loadAdminRequests(); };
window.adminRejectVerifyAction = async (id) => { await sb.from('app_users').update({ verification_requested: false }).eq('user_id', id); alert('Request rejected.'); loadAdminRequests(); };
window.adminBanAction = async () => { const id = el('ban-id') ? el('ban-id').value : el('sm-ban-id').value; const mins = el('ban-mins') ? el('ban-mins').value : el('sm-ban-mins').value; const fine = el('ban-fine') ? el('ban-fine').value : el('sm-ban-fine').value; if(!id || !mins) return alert('Enter ID and Mins.'); const { data: u } = await sb.from('app_users').select('*').eq('user_id', id).single(); if(!u) return alert('User not found.'); const banUntil = new Date(Date.now() + parseInt(mins) * 60000).toISOString(); let newCurrency = parseFloat(u.currency); if(parseFloat(fine) > 0) { newCurrency -= parseFloat(fine); if(newCurrency < 0) newCurrency = 0; const treasury = await getTreasury(); await updateTreasury({ fund_balance: parseFloat(treasury.fund_balance) + parseFloat(fine) }); } await sb.from('app_users').update({ banned_until: banUntil, current_room_id: 3, currency: newCurrency, ban_fine: parseFloat(fine) }).eq('user_id', id); await sb.from('public_messages').insert([{ room_id: u.current_room_id || 1, user_id: 3, username: 'SystemBot', content: `🔨 User ${u.username} has been banned.` }]); await sb.from('private_messages').insert([{ sender_id: 3, receiver_id: id, content: `🚨 You have been banned for ${mins} minutes. Fine: ${fine} Ð.` }]); alert('User banned!'); el('tb-admin').click(); };
window.adminUnbanAction = async () => { const id = el('unban-id') ? el('unban-id').value : el('sm-unban-id').value; if(!id) return alert('Enter ID.'); const { data: u } = await sb.from('app_users').select('*').eq('user_id', id).single(); if(!u) return alert('User not found.'); await sb.from('app_users').update({ banned_until: new Date().toISOString(), current_room_id: 1, ban_fine: 0 }).eq('user_id', id); await sb.from('public_messages').insert([{ room_id: 1, user_id: 3, username: 'SystemBot', content: `✅ User ${u.username} has been unbanned.` }]); await sb.from('private_messages').insert([{ sender_id: 3, receiver_id: id, content: '✅ You have been unbanned! Welcome back.' }]); alert('User unbanned!'); el('tb-admin').click(); };
window.adminAddRateAction = async () => { const id = el('addrate-id').value; const amt = el('addrate-amt').value; if(!id || !amt) return alert('Enter ID and Amount.'); const { data: u } = await sb.from('app_users').select('rating_points').eq('user_id', id).single(); if(!u) return alert('User not found.'); await sb.from('app_users').update({ rating_points: parseInt(u.rating_points) + parseInt(amt) }).eq('user_id', id); alert('Rating added!'); el('tb-admin').click(); };
window.adminCutRateAction = async () => { const id = el('cutrate-id').value; const amt = el('cutrate-amt').value; if(!id || !amt) return alert('Enter ID and Amount.'); const { data: u } = await sb.from('app_users').select('rating_points').eq('user_id', id).single(); if(!u) return alert('User not found.'); let newScore = parseInt(u.rating_points) - parseInt(amt); if(newScore < 0) newScore = 0; await sb.from('app_users').update({ rating_points: newScore }).eq('user_id', id); alert('Rating cut!'); el('tb-admin').click(); };
window.adminResetPassAction = async () => { const id = el('reset-id').value; if(!id) return alert('Enter ID.'); await sb.from('app_users').update({ password: '123456' }).eq('user_id', id); alert('Password reset to 123456.'); el('tb-admin').click(); };
window.adminAdjustDotsAction = async () => { const id = el('dots-id').value; const amt = el('dots-amt').value; if(!id || !amt) return alert('Enter ID and Amount.'); const { data: u } = await sb.from('app_users').select('currency').eq('user_id', id).single(); if(!u) return alert('User not found.'); let newBal = parseFloat(u.currency) + parseFloat(amt); if(newBal < 0) newBal = 0; await sb.from('app_users').update({ currency: newBal }).eq('user_id', id); alert('Dots adjusted!'); el('tb-admin').click(); };
window.adminClearRoomAction = async () => { const id = el('clear-id').value; if(!id) return alert('Enter Room ID.'); if(!confirm('Are you sure?')) return; await sb.from('public_messages').delete().eq('room_id', id); alert('Messages cleared!'); if(currentRoom == id) loadMessages(); };
window.adminDeleteRoomAction = async () => { const id = el('del-id').value; if(!id) return alert('Enter Room ID.'); if(id == 1 || id == 2 || id == 3) return alert('Cannot delete system rooms.'); if(!confirm('Are you sure?')) return; await sb.from('public_messages').delete().eq('room_id', id); await sb.from('rooms').delete().eq('room_id', id); alert('Room deleted!'); joinRoom(1); };
window.adminEconomyAction = async () => { const vip = el('vip-fee').value; const bc = el('bc-fee').value; await updateTreasury({ vip_entry_fee: parseFloat(vip), broadcast_fee: parseFloat(bc) }); alert('Economy settings saved!'); };
window.adminMintAction = async () => { const amt = el('mint-amt').value; const target = el('mint-target').value; if(!amt) return alert('Enter amount.'); const treasury = await getTreasury(); if(target === 'tax') await updateTreasury({ tax_balance: parseFloat(treasury.tax_balance) + parseFloat(amt) }); else await updateTreasury({ fund_balance: parseFloat(treasury.fund_balance) + parseFloat(amt) }); alert('Minted!'); el('tb-admin').click(); };
window.adminBurnAction = async () => { const amt = el('burn-amt').value; const target = el('burn-target').value; if(!amt) return alert('Enter amount.'); const treasury = await getTreasury(); if(target === 'tax') await updateTreasury({ tax_balance: parseFloat(treasury.tax_balance) - parseFloat(amt) }); else await updateTreasury({ fund_balance: parseFloat(treasury.fund_balance) - parseFloat(amt) }); alert('Burned!'); el('tb-admin').click(); };
window.adminCreateCodeAction = async () => { const code = el('rc-code').value; const val = el('rc-val').value; const uses = el('rc-uses').value; if(!code || !val || !uses) return alert('Fill all fields.'); await sb.from('redeem_codes').insert([{ code: code, reward_value: parseFloat(val), max_uses: parseInt(uses) }]); alert('Code created!'); el('tb-admin').click(); };
window.adminEditGiftAction = async (id, name) => { const newPrice = prompt(`New price for ${name}:`); if(newPrice === null) return; const newStock = prompt(`New stock for ${name}:`); if(newStock === null) return; await sb.from('gifts').update({ price: parseFloat(newPrice), stock: parseInt(newStock) }).eq('id', id); alert('Gift updated!'); loadAdminGifts(); };
window.adminAddSMAction = async () => { const id = el('sm-id').value; if(!id) return alert('Enter User ID.'); const { data: u } = await sb.from('app_users').select('*').eq('user_id', id).single(); if(!u) return alert('User not found.'); if(u.is_admin) return alert('User is already Admin.'); await sb.from('app_users').update({ is_super_mod: true }).eq('user_id', id); alert('Super Mod added!'); el('tb-admin').click(); };
window.adminRemoveSMAction = async (id) => { await sb.from('app_users').update({ is_super_mod: false }).eq('user_id', id); alert('Super Mod removed!'); el('tb-admin').click(); };

function openModal(t,b,wide){el('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-card ${wide?'wide':''}"><span class="close-x" onclick="closeModal()">✕</span><h3 style="margin:0 0 16px;font-size:16px;">${t}</h3>${b}</div></div>`;}
function closeModal(){el('modal-root').innerHTML='';}
function showCtx(e, u, uid){ e.stopPropagation(); const m=document.createElement('div'); m.className='ctx-menu'; m.style.left=e.clientX+'px';m.style.top=e.clientY+'px'; m.innerHTML=`<div class="ctx-item" onclick="startNewPM('${escapeHtml(u)}');closeCtx();">💬 Private Message</div><div class="ctx-item" onclick="viewProfile('${uid}');closeCtx();">👤 View Profile</div><div class="ctx-item" onclick="addFriend('${escapeHtml(u)}');closeCtx();">➕ Add Friend</div><div class="ctx-item" onclick="sendDotsPrompt('${uid}');closeCtx();">🪙 Send Dots</div>`; el('context-root').innerHTML='';el('context-root').appendChild(m); }
function closeCtx(){el('context-root').innerHTML='';}
window.onclick=closeCtx;
</script>
</body>
</html>
