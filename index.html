<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dotverse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --bg:#fff; --ink:#14181f; --muted:#6b7280; --line:#e7e9ee; --dot:#3d5afe; --dot-soft:#eef0ff; --danger:#e14b4b; }
  *{box-sizing:border-box;} html,body{height:100%;margin:0;font-family:"Tahoma","Arial",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
  .hidden{display:none!important;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  
  /* Auth */
  .auth-wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;overflow-y:auto;}
  .auth-card{width:100%;max-width:380px;border:1px solid var(--line);border-radius:14px;padding:32px 28px;background:#fff;box-shadow:0 12px 32px -12px rgba(0,0,0,.1);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand-dot{width:14px;height:14px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 4px var(--dot-soft);}
  .brand-name{font-size:20px;font-weight:700;}
  .auth-sub{color:var(--muted);font-size:13.5px;margin:0 0 24px;}
  .tabs{display:flex;gap:4px;margin-bottom:20px;background:#f4f5f7;border-radius:10px;padding:3px;}
  .tab{flex:1;text-align:center;padding:8px 0;font-size:13.5px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--muted);}
  .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);}
  label.field{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 6px;}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;outline:none;background:#fbfbfc;font-family:inherit;}
  input:focus,select:focus{border-color:var(--dot);background:#fff;}
  .btn{padding:12px 0;border:none;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:700;width:100%;background:var(--dot);color:#fff;margin-top:20px;font-family:inherit;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;background:#f4f5f7;color:var(--ink);width:auto;margin:0;}
  .btn-danger{background:#ef4444;color:#fff;}
  .auth-msg{font-size:13px;margin-top:12px;min-height:16px;color:var(--danger);}

  /* Shell */
  #app{height:100%; display:flex; flex-direction:column;}
  #shell{display:flex;flex-direction:column;height:100%;overflow:hidden;}
  #topbar-mobile{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0;overflow-x:auto;}
  .topbar-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:12px 4px;cursor:pointer;color:var(--muted);min-width:45px;}
  .topbar-btn .tb-icon{font-size:20px;}
  .topbar-btn .tb-label{display:none;}
  .topbar-btn.hidden{display:none;}
  
  #main{flex:1;display:flex;flex-direction:column;min-height:0;}
  #broadcast-root{background:#fffae6; color:#b45309; text-align:center; padding:8px 15px; font-size:12.5px; border-bottom:1px solid var(--line); font-weight:600;}
  #room-header{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
  #room-header .rtitle{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
  #room-header .rscore{font-size:12px;color:var(--muted);}
  
  #messages{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:0;}
  .msg{display:flex;gap:8px;align-items:flex-start;}
  .avatar-emoji{font-size:16px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--dot-soft);border-radius:50%;flex-shrink:0;cursor:pointer;overflow:hidden;}
  .avatar-img{width:100%;height:100%;object-fit:cover;}
  .msg-body{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .msg-name{font-size:13px;font-weight:700;cursor:pointer;}
  .msg-text{font-size:14px;word-break:break-word;}
  .sys-msg{text-align:center;color:var(--muted);font-size:12px;font-style:italic;margin:5px 0;}
  
  #composer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-shrink:0;}
  #composer input{flex:1;font-family:inherit;}
  #composer button{padding:0 20px;margin:0;width:auto;}

  /* Modals & Menus */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;overflow-y:auto;}
  .modal-card{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:380px;max-height:86vh;overflow-y:auto;box-sizing:border-box;}
  .modal-card.wide{max-width:600px;}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-weight:700;}
  .list-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f4f5f7;font-size:13px;cursor:pointer;}
  .ctx-menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.2);padding:6px;z-index:90;min-width:180px;}
  .ctx-item{padding:9px 12px;font-size:13px;font-weight:600;border-radius:7px;cursor:pointer;}
  .ctx-item:hover{background:#f4f5f7;}
  
  /* Profile Styles (Shared) */
  .p-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f4f5f7;padding:10px 0;min-height:40px;}
  .p-label{width:45%;font-size:13px;color:var(--muted);font-weight:600;border-right:1px solid var(--line);padding-right:10px;text-align:left;}
  .p-val{width:55%;padding-left:10px;display:flex;justify-content:flex-end;align-items:center;}
  .p-input, .p-select{width:100%;max-width:140px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:#f9f9f9;outline:none;text-align:right;font-family:inherit;}
  .p-input:focus, .p-select:focus{border-color:var(--dot);background:#fff;}
  .p-bubble{background:var(--dot-soft);color:var(--dot);padding:6px 16px;border-radius:20px;font-weight:700;font-size:13px;text-align:center;}
  .p-btn-row{display:flex;gap:10px;margin-top:20px;}
  .p-btn{flex:1;padding:10px;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
  .p-btn-save{background:var(--dot);color:#fff;}
  .p-btn-logout{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .p-color-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:140px;}
  .p-color-opt{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .p-color-opt.selected{border-color:var(--ink);}

  /* PM Popups & History */
  #pm-popup-root{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:120;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .pm-popup-card{width:fit-content;min-width:220px;max-width:320px;border:1px solid rgba(0,0,0,0.5);box-shadow:2px 3px 8px rgba(0,0,0,0.45);display:flex;flex-direction:column;background:#fff;}
  .pm-popup-header{display:flex;justify-content:space-between;align-items:center;padding:0 0 0 8px;color:#fff;font-size:14px;font-weight:bold;height:26px;}
  .pm-popup-close{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#000;}
  .pm-popup-text{padding:12px;color:#000;font-size:12px;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.4;min-height:40px;}
  .pm-popup-actions{display:flex;height:28px;}
  .pm-popup-actions button{flex:1;color:#000;border:2px outset;font-size:12px;cursor:pointer;font-family:inherit;font-weight:bold;white-space:nowrap;}
  .pm-popup-reply-box{display:flex;height:28px;}
  .pm-popup-reply-box input{flex:1;padding:4px 8px;border:1px solid #ccc;font-size:12px;outline:none;font-family:inherit;}
  .pm-popup-reply-box button{width:60px;color:#000;border:2px outset;font-size:12px;cursor:pointer;font-family:inherit;font-weight:bold;white-space:nowrap;}
  
  .pm-history-view{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;padding:10px;background:#f9f9f9;border-radius:8px;margin-bottom:16px;}
  .pm-history-msg{max-width:80%;padding:8px 12px;border-radius:8px;font-size:13px;word-break:break-word;color:#000;}

  /* Community, Search & Dots Tabs */
  .pm-modal-tabs{display:flex;gap:4px;margin-bottom:20px;background:#f4f5f7;border-radius:10px;padding:3px;}
  .pm-modal-tab{flex:1;text-align:center;padding:8px 0;font-size:13.5px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--muted);}
  .pm-modal-tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);}
  .friend-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f4f5f7;}
  .friend-info{display:flex;align-items:center;gap:10px;}
  .friend-av{font-size:20px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--dot-soft);border-radius:50%;overflow:hidden;}
  .friend-name{font-weight:600;font-size:14px;}
  .friend-actions{display:flex;gap:4px;}
  .act-btn{border:none;background:#f4f5f7;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .act-btn.danger{background:#fee2e2;color:#ef4444;}
  .act-btn.primary{background:var(--dot);color:#fff;}
  .lb-rank{width:24px; height:24px; background:var(--dot); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:bold;}
</style>
</head>
<body>

<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="brand-dot"></span><span class="brand-name">Dotverse</span></div>
    <p class="auth-sub">A tiny chat world. Ten seats. One dot at a time.</p>
    <div class="tabs">
      <div class="tab active" id="tab-login">Log in</div>
      <div class="tab" id="tab-register">Register</div>
    </div>
    <div id="form-login">
      <label class="field">Username</label><input type="text" id="login-username" />
      <label class="field">Password</label><input type="password" id="login-password" />
      <button class="btn" id="btn-login">Log in</button>
    </div>
    <div id="form-register" class="hidden">
      <label class="field">Username</label><input type="text" id="reg-username" />
      <label class="field">Password</label><input type="password" id="reg-password" />
      <label class="field">Gender</label><select id="reg-gender"><option value="male">Male</option><option value="female">Female</option></select>
      <label class="field">City</label><input type="text" id="reg-city" />
      <button class="btn" id="btn-register">Create account</button>
    </div>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<div id="shell" class="hidden">
  <div id="topbar-mobile">
    <div class="topbar-btn" id="tb-profile"><span class="tb-icon">👤</span><span class="tb-label">Profile</span></div>
    <div class="topbar-btn" id="tb-pms"><span class="tb-icon">👥</span><span class="tb-label">Community</span></div>
    <div class="topbar-btn" id="tb-rooms"><span class="tb-icon">💬</span><span class="tb-label">Rooms</span></div>
    <div class="topbar-btn" id="tb-dots"><span class="tb-icon">🪙</span><span class="tb-label">Dots</span></div>
    <div class="topbar-btn" id="tb-search"><span class="tb-icon">🔍</span><span class="tb-label">Search</span></div>
    <div class="topbar-btn hidden" id="tb-admin"><span class="tb-icon">👑</span><span class="tb-label">Admin</span></div>
    <div class="topbar-btn" id="tb-roominfo"><span class="tb-icon">ℹ️</span><span class="tb-label">Room</span></div>
  </div>
  <div id="main">
    <div id="broadcast-root" class="hidden"></div>
    <div id="room-header">
      <div class="rtitle"><span id="room-title">Lobby</span><span class="rscore" id="room-meta">ID: 1</span></div>
    </div>
    <div id="messages"></div>
    <div id="composer">
      <input type="text" id="msg-input" placeholder="Say something…" maxlength="500" />
      <button class="btn btn-sm" id="btn-send">Send</button>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<div id="context-root"></div>
<div id="pm-popup-root"></div>

<script>
const SUPABASE_URL = "https://secsiftaabzbrfbaeaxn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlY3NpZnRhYWJ6YnJmYmFlYXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODY4NzIsImV4cCI6MjEwMTM2Mjg3Mn0.ZBFujtK74JZK6NsI5vGO_O733qY2rSsPmvnbBcZSxu4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_GIF = "https://secsiftaabzbrfbaeaxn.supabase.co/storage/v1/object/public/Avatars/Dot.gif";

let currentUser = null, currentRoom = 1, msgSubscription = null, pmSubscription = null, broadcastSubscription = null, userStatusSubscription = null;
const userCache = {}; 
const AVATARS = ["🦊","🦄","🐰","🐭","🍄","☢️","🌼","♥️","♠️","♣️","♦️","👺","👻","👽","⛄","💀","👤","🧑🏻‍🚀","🧒🏻","👩🏻","🍁","🍀","🌲","⚡","🐥","🛡️","♂️","♀️"];
const COLORS = ["#000000", "#ef4444", "#f97316", "#eab308", "#22c55e", "#06b6d4", "#3b82f6", "#8b5cf6", "#ec4899", "#6b7280", "#f5780e"];

function el(id){return document.getElementById(id);}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function showMsg(t,ok){const e=el('auth-msg');e.textContent=t;e.className='auth-msg '+(ok?'ok':'error');}

el('tab-login').onclick=()=>{el('tab-login').classList.add('active');el('tab-register').classList.remove('active');el('form-login').classList.remove('hidden');el('form-register').classList.add('hidden');showMsg('',true);};
el('tab-register').onclick=()=>{el('tab-register').classList.add('active');el('tab-login').classList.remove('active');el('form-register').classList.remove('hidden');el('form-login').classList.add('hidden');showMsg('',true);};

// --- Auth Logic ---
el('btn-register').onclick = async () => {
  const u=el('reg-username').value.trim(),p=el('reg-password').value,g=el('reg-gender').value,c=el('reg-city').value.trim();
  if(u.length < 3 || u.length > 14) return showMsg('Username must be 3-14 chars.');
  if(p.length < 3 || p.length > 14) return showMsg('Password must be 3-14 chars.');
  
  const { data, error } = await sb.from('app_users').insert([{ username: u, password: p, gender: g, city: c, currency: 10.00 }]).select().single();
  if (error) {
    if(error.message.includes('duplicate')) return showMsg('Username already exists.');
    return showMsg('Error: ' + error.message);
  }
  currentUser = data;
  startApp();
};

el('btn-login').onclick = async () => {
  const u=el('login-username').value.trim(),p=el('login-password').value;
  if(!u||!p) return showMsg('Enter credentials.');
  
  const { data, error } = await sb.from('app_users').select('*').eq('username', u).eq('password', p).single();
  if (error || !data) return showMsg('Invalid username or password.');
  currentUser = data;
  startApp();
};

// --- App Shell Logic ---
async function startApp(){
  el('auth-screen').classList.add('hidden');
  el('shell').classList.remove('hidden');
  if(currentUser.is_admin) el('tb-admin').classList.remove('hidden');
  joinRoom(1);
  subscribeToPMs();
  subscribeToBroadcasts();
  subscribeToUserStatus();
}

// --- Rating & Color Logic ---
function getPmColorScheme(user) {
  if (!user) return { header:'#6b7280', body:'#e5e7eb', footer:'#6b7280', close:'#9ca3af', border:'#6b7280' };
  if (user.is_admin) return { header:'linear-gradient(#a44600, #8c3d00)', body:'#ff7910', footer:'linear-gradient(#a44600, #8c3d00)', close:'#ef6500', border:'#a4600e' };
  if (user.user_id === 3) return { header:'linear-gradient(#ca8a04, #b45309)', body:'#fef9c3', footer:'linear-gradient(#ca8a04, #b45309)', close:'#fde047', border:'#ca8a04' }; // SystemBot Yellow
  
  let score = user.rating_points || 0;
  let gender = user.gender || 'male';
  
  if (score <= 100) return gender === 'female' ? { header:'linear-gradient(#ec4899, #db2777)', body:'#fbcfe8', footer:'linear-gradient(#ec4899, #db2777)', close:'#f9a8d4', border:'#f472b6' } : { header:'linear-gradient(#3b82f6, #2563eb)', body:'#bfdbfe', footer:'linear-gradient(#3b82f6, #2563eb)', close:'#93c5fd', border:'#60a5fa' };
  if (score <= 200) return gender === 'female' ? { header:'linear-gradient(#b91c1c, #991b1b)', body:'#f87171', footer:'linear-gradient(#b91c1c, #991b1b)', close:'#ef4444', border:'#dc2626' } : { header:'linear-gradient(#1d4ed8, #1e40af)', body:'#60a5fa', footer:'linear-gradient(#1d4ed8, #1e40af)', close:'#3b82f6', border:'#2563eb' };
  if (score <= 500) return { header:'linear-gradient(#b91c1c, #991b1b)', body:'#f87171', footer:'linear-gradient(#b91c1c, #991b1b)', close:'#ef4444', border:'#dc2626' };
  if (score <= 1000) return { header:'linear-gradient(#8b5cf6, #7c3aed)', body:'#ddd6fe', footer:'linear-gradient(#8b5cf6, #7c3aed)', close:'#c4b5fd', border:'#a78bfa' };
  if (score <= 1500) return { header:'linear-gradient(#6d28d9, #5b21b6)', body:'#c4b5fd', footer:'linear-gradient(#6d28d9, #5b21b6)', close:'#a78bfa', border:'#7c3aed' };
  if (score <= 2000) return { header:'linear-gradient(#0891b2, #0e7490)', body:'#67e8f9', footer:'linear-gradient(#0891b2, #0e7490)', close:'#22d3ee', border:'#06b6d4' };
  return { header:'linear-gradient(#e5e7eb, #d1d5db)', body:'#ffffff', footer:'linear-gradient(#e5e7eb, #d1d5db)', close:'#f3f4f6', border:'#9ca3af' };
}

// --- Treasury Helper ---
async function getTreasury() { const { data } = await sb.from('admin_settings').select('*').eq('id', 1).single(); return data; }
async function updateTreasury(updates) { await sb.from('admin_settings').update(updates).eq('id', 1); }

// --- Logs Helper ---
async function addLog(text) {
  await sb.from('transaction_logs').insert([{ user_id: currentUser.user_id, log_text: text }]);
}

// --- Realtime Subscriptions ---
function subscribeToUserStatus() {
  if (userStatusSubscription) sb.removeChannel(userStatusSubscription);
  userStatusSubscription = sb.channel('user_status')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_users', filter: `user_id=eq.${currentUser.user_id}` }, payload => {
      const updatedUser = payload.new;
      const wasBanned = new Date(currentUser.banned_until) < new Date();
      const isBannedNow = new Date(updatedUser.banned_until) > new Date();
      
      if (!wasBanned && isBannedNow) {
        currentUser = updatedUser;
        joinRoom(3);
      } else if (wasBanned && !isBannedNow && currentRoom === 3) {
        currentUser = updatedUser;
        joinRoom(1);
      }
      currentUser = updatedUser;
    })
    .subscribe();
}

function subscribeToBroadcasts() {
  if (broadcastSubscription) sb.removeChannel(broadcastSubscription);
  sb.from('broadcasts').select('*').gt('expires_at', new Date().toISOString()).then(({ data }) => {
    if (data && data.length > 0) showBroadcast(data[0]);
  });
  broadcastSubscription = sb.channel('broadcasts')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'broadcasts' }, payload => {
      showBroadcast(payload.new);
    })
    .subscribe();
}

function showBroadcast(b) {
  const now = new Date();
  const expires = new Date(b.expires_at);
  if (expires < now) return;
  
  const root = el('broadcast-root');
  root.innerHTML = `📢 ${escapeHtml(b.content)}`;
  root.classList.remove('hidden');
  
  const timeLeft = expires.getTime() - now.getTime();
  setTimeout(() => {
    root.classList.add('hidden');
    root.innerHTML = '';
  }, timeLeft);
}

// --- Chat Room Logic ---
async function joinRoom(id){
  closeModal();
  
  if (id === 2 && currentUser.user_id !== 1 && currentUser.user_id !== 3) {
    const settings = await getTreasury();
    const fee = parseFloat(settings.vip_entry_fee);
    if (currentUser.currency < fee) return alert(`Entering VIP room costs ${fee} Ð. You don't have enough dots.`);
    if (!confirm(`Entering VIP room costs ${fee} Ð. Proceed?`)) return;
    
    const { data: updatedUser } = await sb.from('app_users').update({ currency: currentUser.currency - fee }).eq('user_id', currentUser.user_id).select().single();
    currentUser = updatedUser;
    await updateTreasury({ fund_balance: parseFloat(settings.fund_balance) + fee });
    alert('Welcome to VIP Room!');
  }

  currentRoom = id;
  if (msgSubscription) await sb.removeChannel(msgSubscription);

  const { data: room } = await sb.from('rooms').select('*').eq('room_id', id).single();
  if (room) {
    el('room-title').textContent = room.name;
    el('room-meta').textContent = 'ID: ' + room.room_id + ' · ' + room.rating_points + ' pts';
  }

  await loadMessages();

  const isBanned = new Date(currentUser.banned_until) > new Date();
  if (id === 3 && isBanned) {
    el('composer').classList.add('hidden');
    const banDiv = document.createElement('div');
    banDiv.id = 'ban-banner';
    banDiv.style.cssText = 'text-align:center; padding:30px 20px; background:#fee2e2; color:#ef4444; font-weight:bold;';
    banDiv.innerHTML = `You are banned! Pay ${currentUser.ban_fine} Ð fine to leave.<br><button class="btn btn-danger" style="margin-top:15px;" onclick="payFine()">Pay Fine</button>`;
    el('main').appendChild(banDiv);
  } else {
    el('composer').classList.remove('hidden');
    const banBanner = el('ban-banner');
    if(banBanner) banBanner.remove();
  }

  msgSubscription = sb.channel('public:public_messages:room_id=eq.' + id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'public_messages', filter: `room_id=eq.${id}` }, payload => {
      appendMessage(payload.new, true);
    })
    .subscribe();
}

async function loadMessages(){
  const { data } = await sb.from('public_messages')
    .select('*, sender:app_users(username, avatar_url, id_color, is_admin, is_system)')
    .eq('room_id', currentRoom)
    .order('created_at', { ascending: true })
    .limit(50);
  
  const w = el('messages');
  w.innerHTML = '';
  if (data) data.forEach(m => appendMessage(m, false));
  w.scrollTop = w.scrollHeight;
}

async function getUserData(userId) {
  const cached = userCache[userId];
  const now = Date.now();
  if (cached && cached._ts && (now - cached._ts < 15000)) return cached;
  const { data } = await sb.from('app_users').select('user_id, username, avatar_url, id_color, is_admin, is_system, rating_points, gender').eq('user_id', userId).single();
  userCache[userId] = data || { username: 'Unknown', avatar_url: '🙂', id_color: '#000' };
  userCache[userId]._ts = now;
  return userCache[userId];
}

async function appendMessage(m, isRealtime){
  const w = el('messages');
  const div = document.createElement('div');
  
  if (!m.user_id) { 
    div.className = 'sys-msg';
    div.textContent = m.content;
    w.appendChild(div);
    if (isRealtime) w.scrollTop = w.scrollHeight;
    return;
  }

  let uData = m.sender || m.app_users;
  if (m.user_id === currentUser.user_id) {
    uData = { username: currentUser.username, avatar_url: currentUser.avatar_url, id_color: currentUser.id_color, is_admin: currentUser.is_admin, is_system: currentUser.is_system };
  } else if (!uData && m.user_id) {
    uData = await getUserData(m.user_id);
  }
  
  const userId = m.user_id;
  const username = uData ? uData.username : (m.username || 'Unknown');
  const avatarHtml = uData && uData.is_admin ? `<img src="${ADMIN_GIF}" class="avatar-img">` : (uData && uData.is_system ? '⚙️' : (uData ? (uData.avatar_url || '🙂') : '🙂'));
  const nameColor = uData ? (uData.id_color || '#000') : '#000';
  
  div.className = 'msg';
  div.innerHTML = `<span class="avatar-emoji" onclick="showCtx(event,'${escapeHtml(username)}', '${userId}')">${avatarHtml}</span>
                   <div class="msg-body"><span class="msg-name" style="color:${nameColor}" onclick="showCtx(event,'${escapeHtml(username)}', '${userId}')">${escapeHtml(username)}</span><span class="msg-text">${escapeHtml(m.content)}</span></div>`;
  w.appendChild(div);
  if (isRealtime) w.scrollTop = w.scrollHeight;
}

el('btn-send').onclick = async () => {
  if (new Date(currentUser.banned_until) > new Date()) return alert('You are banned and cannot send messages.');
  const t = el('msg-input').value.trim();

  await sb.from('public_messages').insert([
    { room_id: currentRoom, user_id: currentUser.user_id, username: currentUser.username, content: t }
  ]);

  currentUser = updatedUser;

// --- Private Message (PM) Logic ---
function subscribeToPMs() {
  if (pmSubscription) sb.removeChannel(pmSubscription);
  pmSubscription = sb.channel('private_messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'private_messages', filter: `receiver_id=eq.${currentUser.user_id}` }, payload => {
      handleIncomingPM(payload.new);
    })
    .subscribe();
}

async function handleIncomingPM(msg) {
  const { data: sender } = await sb.from('app_users').select('*').eq('user_id', msg.sender_id).single();
  if (sender) openPMPopup(sender.username, msg.content, sender);
}

function openPMPopup(sender, text, senderData) {
  const scheme = getPmColorScheme(senderData);
  const popupId = 'pm-' + Date.now() + Math.random().toString(36).substr(2,5);
  const popup = document.createElement('div');
  popup.className = 'pm-popup-card';
  popup.id = popupId;
  popup.style.borderColor = scheme.border;
  
  let html = `
    <div class="pm-popup-header" style="background:${scheme.header};">
      <span>${escapeHtml(sender)}</span>
      <span class="pm-popup-close" style="background:${scheme.close};" onclick="document.getElementById('${popupId}').remove()">✕</span>
    </div>
    <div class="pm-popup-text" style="background:${scheme.body};">${escapeHtml(text)}</div>
    <div class="pm-popup-actions" id="actions-${popupId}">
      <button style="background:${scheme.footer}; border-color:${scheme.border};" onclick="showReplyBox('${popupId}', '${escapeHtml(sender)}')">Reply</button>
      <button style="background:${scheme.footer}; border-color:${scheme.border};" onclick="viewProfile('${senderData.user_id}'); document.getElementById('${popupId}').remove();">About user</button>
    </div>
    <div class="pm-popup-reply-box hidden" id="reply-${popupId}">
      <input type="text" id="input-${popupId}" placeholder="Type reply..." />
      <button style="background:${scheme.footer}; border-color:${scheme.border};" onclick="sendReply('${escapeHtml(sender)}', '${popupId}')">Send</button>
    </div>`;
  popup.innerHTML = html;
  el('pm-popup-root').appendChild(popup);
}

function showReplyBox(popupId, sender) {
  document.getElementById(`actions-${popupId}`).classList.add('hidden');
  const replyBox = document.getElementById(`reply-${popupId}`);
  replyBox.classList.remove('hidden');
  const inp = document.getElementById(`input-${popupId}`);
  inp.focus();
  inp.addEventListener('keydown', e => { if(e.key==='Enter') sendReply(sender, popupId); });
}

async function sendReply(sender, popupId) {
  const inp = document.getElementById(`input-${popupId}`);
  const t = inp.value.trim();
  if(!t) return;
  const { data: receiver } = await sb.from('app_users').select('user_id').eq('username', sender).single();
  if(receiver) {
    await sb.from('private_messages').insert([{ sender_id: currentUser.user_id, receiver_id: receiver.user_id, content: t }]);
    document.getElementById(popupId).remove(); 
  } else { alert('User not found'); }
}

async function loadPMHistory() {
  const { data: sent } = await sb.from('private_messages').select('receiver_id').eq('sender_id', currentUser.user_id).limit(50);
  const { data: received } = await sb.from('private_messages').select('sender_id').eq('receiver_id', currentUser.user_id).limit(50);
  
  const userIds = new Set();
  sent.forEach(m => userIds.add(m.receiver_id));
  received.forEach(m => userIds.add(m.sender_id));
  userIds.delete(currentUser.user_id);
  userIds.delete(1); 
  userIds.delete(3);

  let historyHtml = '<p style="color:var(--muted);text-align:center;font-size:13px;padding:20px 0;">No history yet.</p>';
  
  if (userIds.size > 0) {
    const idsArray = Array.from(userIds);
    const { data: users } = await sb.from('app_users').select('user_id, username, avatar_url, is_admin, is_system').in('user_id', idsArray);
    if (users && users.length > 0) {
      historyHtml = users.map(u => `
        <div class="friend-row" style="cursor:pointer;" onclick="showChatHistory(${u.user_id}, '${escapeHtml(u.username)}')">
          <div class="friend-info">
            <span class="friend-av">${u.is_admin ? `<img src="${ADMIN_GIF}" class="avatar-img">` : (u.is_system ? '⚙️' : (u.avatar_url||'🙂'))}</span>
            <span class="friend-name">${escapeHtml(u.username)}</span>
          </div>
          <span style="font-size:12px;color:var(--muted)">Tap to chat</span>
        </div>
      `).join('');
    }
  }
  el('comm-history').innerHTML = historyHtml;
}

window.showChatHistory = async (otherUserId, otherUsername) => {
  const orFilter = `and(sender_id.eq.${currentUser.user_id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.user_id})`;
  const { data: msgs } = await sb.from('private_messages').select('*').or(orFilter).order('created_at', { ascending: true }).limit(100);
  
  let historyHtml = '<div class="pm-history-view">';
  if (msgs && msgs.length > 0) {
    msgs.forEach(m => {
      const isMine = m.sender_id === currentUser.user_id;
      historyHtml += `<div class="pm-history-msg" style="align-self:${isMine?'flex-end':'flex-start'}; background:${isMine?'#eef0ff':'#f4f5f7'};">${escapeHtml(m.content)}</div>`;
    });
  } else {
    historyHtml += '<p style="text-align:center;color:var(--muted);">No messages yet.</p>';
  }
  historyHtml += `</div><div style="display:flex;gap:8px;"><input type="text" id="pm-history-input" placeholder="Type a message..." style="flex:1;font-family:inherit;" /><button class="btn-sm" onclick="sendPMFromHistory(${otherUserId}, '${escapeHtml(otherUsername)}')">Send</button></div>`;
  
  openModal(`Chat with ${escapeHtml(otherUsername)}`, historyHtml);
  const view = document.querySelector('.pm-history-view');
  if(view) view.scrollTop = view.scrollHeight;
};

window.sendPMFromHistory = async (otherUserId, otherUsername) => {
  const inp = document.getElementById('pm-history-input');
  const t = inp.value.trim(); if(!t) return;
  await sb.from('private_messages').insert([{ sender_id: currentUser.user_id, receiver_id: otherUserId, content: t }]);
  showChatHistory(otherUserId, otherUsername);
};

window.sendReport = async () => {

  await sb.from('private_messages').insert([{ sender_id: currentUser.user_id, receiver_id: 1, content: '🚨 REPORT: ' + t }]);

  if(!u) u = prompt('Enter username to send a PM:');

  const { data: receiver } = await sb.from('app_users').select('*').eq('username', u).single();

window.buyGift = async (giftId, giftName, giftPrice) => {
  if (currentUser.currency < giftPrice) return alert('Not enough dots.');
  const { data: g } = await sb.from('gifts').select('*').eq('id', giftId).single();
  if (g.stock <= 0) return alert('Out of stock.');
  
  const { data: inv } = await sb.from('user_inventory').select('id, quantity').eq('user_id', currentUser.user_id).eq('gift_id', giftId).maybeSingle();
  const { data: updatedUser } = await sb.from('app_users').update({ currency: currentUser.currency - parseFloat(g.price) }).eq('user_id', currentUser.user_id).select().single();
  currentUser = updatedUser;
  
  await sb.from('gifts').update({ stock: g.stock - 1 }).eq('id', giftId);
  if (inv) await sb.from('user_inventory').update({ quantity: inv.quantity + 1 }).eq('id', inv.id);
  else await sb.from('user_inventory').insert([{ user_id: currentUser.user_id, gift_id: giftId, quantity: 1 }]);
  
  await addLog(`Shop: Bought ${giftName} for ${giftPrice} Ð`);
  alert(`Bought ${g.name}!`);
  openShopModal('gifts');
};

window.sendGiftPrompt = async (giftId, giftName) => {
  const recipientId = prompt(`Send ${giftName} to (Enter User ID):`);
  if (!recipientId) return;
  if (parseInt(recipientId) === currentUser.user_id) return alert('Cannot send to yourself.');
  
  const { data: recipient } = await sb.from('app_users').select('*').eq('user_id', parseInt(recipientId)).single();
  if (!recipient) return alert('User not found.');
  
  const { data: senderInv } = await sb.from('user_inventory').select('id, quantity').eq('user_id', currentUser.user_id).eq('gift_id', giftId).maybeSingle();
  if (!senderInv) return alert('You do not own this gift.');

window.playRoulette = async () => {
  const type = document.getElementById('rl-type').value;
  const num = document.getElementById('rl-num') ? parseInt(document.getElementById('rl-num').value) : 0;
  const amt = parseFloat(document.getElementById('rl-amt').value);
  if(!amt || amt <= 0) return alert('Invalid bet amount.');
  if(amt > currentUser.currency) return alert('Not enough dots.');
  if(type === 'number' && (isNaN(num) || num < 0 || num > 36)) return alert('Invalid number (0-36).');

  const { data: updatedUser } = await sb.from('app_users').update({ currency: currentUser.currency - amt }).eq('user_id', currentUser.user_id).select().single();
  currentUser = updatedUser;
  const treasury = await getTreasury();

  const result = Math.floor(Math.random() * 37); 
  let win = false, multiplier = 0;

  if (type === 'even' && result !== 0 && result % 2 === 0) { win = true; multiplier = 2; }
  else if (type === 'odd' && result % 2 === 1) { win = true; multiplier = 2; }
  else if (type === 'dozen1' && result >= 1 && result <= 12) { win = true; multiplier = 3; }
  else if (type === 'dozen2' && result >= 13 && result <= 24) { win = true; multiplier = 3; }
  else if (type === 'dozen3' && result >= 25 && result <= 36) { win = true; multiplier = 3; }
  else if (type === 'number' && result === num) { win = true; multiplier = 36; }

  let resultText = `Result: ${result}. You ${win ? 'WON' : 'LOST'}.`;
  if (win) {
    const payout = amt * multiplier;
    const { data: finalUser } = await sb.from('app_users').update({ currency: currentUser.currency + payout }).eq('user_id', currentUser.user_id).select().single();
    currentUser = finalUser;
    await updateTreasury({ fund_balance: parseFloat(treasury.fund_balance) - payout });
    resultText += ` +${payout.toFixed(2)} Ð`;
    await addLog(`Roulette: Won ${payout.toFixed(2)} Ð`);
  } else {
    await updateTreasury({ fund_balance: parseFloat(treasury.fund_balance) + amt });
    await addLog(`Roulette: Lost ${amt} Ð`);
  }
  document.getElementById('rl-res').textContent = resultText;
  document.getElementById('rl-res').style.color = win ? '#16a34a' : '#ef4444';
};

  const { data: updatedUser } = await sb.from('app_users').update({ currency: currentUser.currency - amt }).eq('user_id', currentUser.user_id).select().single();
  currentUser = updatedUser;
  const treasury = await getTreasury();

  const choices = ['rock', 'paper', 'scissors'];
  const botChoice = choices[Math.floor(Math.random() * 3)];
  let win = false, tie = false;

  if (choice === botChoice) tie = true;
  else if ((choice === 'rock' && botChoice === 'scissors') || (choice === 'paper' && botChoice === 'rock') || (choice === 'scissors' && botChoice === 'paper')) win = true;

  const icons = { rock: '✊', paper: '✋', scissors: '✌️' };
  let resultText = `You: ${icons[choice]} | Bot: ${icons[botChoice]}<br>`;
  
  if (tie) {
    resultText += 'TIE! Bet returned.';
    const { data: finalUser } = await sb.from('app_users').update({ currency: currentUser.currency + amt }).eq('user_id', currentUser.user_id).select().single();
    currentUser = finalUser;
  } else if (win) {
    const payout = amt * 2;
    const { data: finalUser } = await sb.from('app_users').update({ currency: currentUser.currency + payout }).eq('user_id', currentUser.user_id).select().single();
    currentUser = finalUser;
    await updateTreasury({ fund_balance: parseFloat(treasury.fund_balance) - payout });
    resultText += `WIN! +${payout.toFixed(2)} Ð`;
    await addLog(`RPS: Won ${payout.toFixed(2)} Ð`);
  } else {
    await updateTreasury({ fund_balance: parseFloat(treasury.fund_balance) + amt });
    await addLog(`RPS: Lost ${amt} Ð`);
    resultText += 'LOST!';
  }
  const resEl = document.getElementById('rps-res');
  resEl.innerHTML = resultText;
  resEl.style.color = tie ? '#ca8a04' : (win ? '#16a34a' : '#ef4444');
};

window.transferDots = async () => {
  const toId = parseInt(el('td-to').value);
  const amt = parseFloat(el('td-amt').value);
  if(!toId || !amt || amt <= 0) return alert('Invalid input.');
  if(amt > currentUser.currency) return alert('Not enough dots.');
  if(toId === currentUser.user_id) return alert('Cannot send to yourself.');
  
  const { data: receiver } = await sb.from('app_users').select('*').eq('user_id', toId).single();
  if (!receiver) return alert('Receiver not found.');

  const tax = amt * 0.1;
  const receiverGets = amt - tax;
  const treasury = await getTreasury();

  const { data: updatedSender } = await sb.from('app_users').update({ currency: currentUser.currency - amt }).eq('user_id', currentUser.user_id).select().single();
  await sb.from('app_users').update({ currency: receiver.currency + receiverGets }).eq('user_id', toId);
  await updateTreasury({ tax_balance: parseFloat(treasury.tax_balance) + tax });

  currentUser = updatedSender;
  await addLog(`Sent ${amt} Ð to ID #${toId}`);
  await sb.from('private_messages').insert([{ sender_id: 3, receiver_id: toId, content: `💸 You received ${receiverGets.toFixed(2)} Ð from ${currentUser.username}!` }]);
  
  alert(`Success! Sent ${amt}Ð to ID #${toId}. They received ${receiverGets.toFixed(2)}Ð.`);
  closeModal();
  el('tb-dots').click(); 
};

window.sendBroadcast = async () => {
  const text = el('bc-text').value.trim();
  if (!text) return alert('Enter a message.');
  const settings = await getTreasury();
  const fee = parseFloat(settings.broadcast_fee);
  
  if (currentUser.currency < fee) return alert(`Broadcast costs ${fee} Ð. Not enough dots.`);
  if (!confirm(`This will cost ${fee} Ð. Proceed?`)) return;
  
  // Queue logic: expires 1 min after the latest active broadcast
  const { data: active } = await sb.from('broadcasts').select('expires_at').gt('expires_at', new Date().toISOString()).order('expires_at', { ascending: false }).limit(1);
  let expiresAt = new Date(Date.now() + 60000).toISOString();
  if (active && active.length > 0) {
    expiresAt = new Date(new Date(active[0].expires_at).getTime() + 60000).toISOString();
  }
  
  await sb.from('broadcasts').insert([{ content: text, sender_username: currentUser.username, expires_at: expiresAt }]);
  
  const { data: updatedUser } = await sb.from('app_users').update({ currency: currentUser.currency - fee }).eq('user_id', currentUser.user_id).select().single();
  currentUser = updatedUser;
  await updateTreasury({ fund_balance: parseFloat(settings.fund_balance) + fee });
  await addLog(`Broadcast: Sent message for ${fee} Ð`);
  
  alert('Broadcast sent! It will appear shortly.');
  closeModal();
  el('tb-dots').click();
};

window.adminTransferTreasuryPrompt = async () => { const amt = prompt('Amount to transfer:'); const src = prompt('From (fund/tax):', 'fund'); const treasury = await getTreasury(); const { data: admin } = await sb.from('app_users').select('currency').eq('user_id', 1).single(); await sb.from('app_users').update({ currency: parseFloat(admin.currency) + parseFloat(amt) }).eq('user_id', 1); if(src === 'tax') await updateTreasury({ tax_balance: parseFloat(treasury.tax_balance) - parseFloat(amt) }); else await updateTreasury({ fund_balance: parseFloat(treasury.fund_balance) - parseFloat(amt) }); alert('Transferred to Admin!'); el('tb-admin').click(); };
window.adminBurnPrompt = async () => { const amt = prompt('Amount to burn:'); const src = prompt('From (fund/tax):', 'fund'); const treasury = await getTreasury(); if(src === 'tax') await updateTreasury({ tax_balance: parseFloat(treasury.tax_balance) - parseFloat(amt) }); else await updateTreasury({ fund_balance: parseFloat(treasury.fund_balance) - parseFloat(amt) }); alert('Burned!'); el('tb-admin').click(); };
window.adminVerifyPrompt = async () => { const id = prompt('Enter User ID to verify:'); const { data: u } = await sb.from('app_users').select('*').eq('user_id', id).single(); if(!u) return alert('User not found.'); if(!u.verification_requested) return alert('This user has not requested verification.'); await sb.from('app_users').update({ is_verified: true, verification_requested: false }).eq('user_id', id); alert('User verified successfully!'); el('tb-admin').click(); };

window.adminBanPrompt = async () => {
  const id = prompt('Enter User ID to ban:');
  if(!id) return;
  const mins = prompt('Ban duration (minutes):', '60');
  if(!mins) return;
  const fine = prompt('Fine amount (Dots):', '10');
  if(fine === null) return;

  const { data: u } = await sb.from('app_users').select('*').eq('user_id', id).single();
  if(!u) return alert('User not found.');
  
  const banUntil = new Date(Date.now() + parseInt(mins) * 60000).toISOString();
  let newCurrency = parseFloat(u.currency);
  
  if(parseFloat(fine) > 0) {
    newCurrency -= parseFloat(fine);
    if(newCurrency < 0) newCurrency = 0;
    const treasury = await getTreasury();
    await updateTreasury({ fund_balance: parseFloat(treasury.fund_balance) + parseFloat(fine) });
  }
  
  await sb.from('app_users').update({ banned_until: banUntil, current_room_id: 3, currency: newCurrency, ban_fine: parseFloat(fine) }).eq('user_id', id);
  
  await sb.from('public_messages').insert([{ room_id: u.current_room_id || 1, user_id: 3, username: 'SystemBot', content: `🔨 User ${u.username} has been banned.` }]);
  await sb.from('private_messages').insert([{ sender_id: 3, receiver_id: id, content: `🚨 You have been banned for ${mins} minutes. Fine: ${fine} Ð.` }]);
  
  alert('User banned and moved to Room 3!');
  el('tb-admin').click();
};

window.adminUnbanPrompt = async () => {
  const id = prompt('Enter User ID to unban:');
  if(!id) return;
  
  const { data: u } = await sb.from('app_users').select('*').eq('user_id', id).single();
  if(!u) return alert('User not found.');
  
  await sb.from('app_users').update({ banned_until: new Date().toISOString(), current_room_id: 1, ban_fine: 0 }).eq('user_id', id);
  
  await sb.from('public_messages').insert([{ room_id: 1, user_id: 3, username: 'SystemBot', content: `✅ User ${u.username} has been unbanned.` }]);
  await sb.from('private_messages').insert([{ sender_id: 3, receiver_id: id, content: '✅ You have been unbanned! Welcome back.' }]);
  
  alert('User unbanned!');
  el('tb-admin').click();
};

window.adminDotsPrompt = async () => { const id = prompt('Enter User ID:'); const amt = prompt('Amount (use negative to remove):', '10'); const { data: u } = await sb.from('app_users').select('currency').eq('user_id', id).single(); if(!u) return alert('User not found.'); let newBal = parseFloat(u.currency) + parseFloat(amt); if(newBal < 0) newBal = 0; await sb.from('app_users').update({ currency: newBal }).eq('user_id', id); alert('Dots updated!'); el('tb-admin').click(); };
window.adminRatingPrompt = async () => { const id = prompt('Enter User ID:'); const amt = prompt('Amount (use negative to remove):', '100'); const { data: u } = await sb.from('app_users').select('rating_points').eq('user_id', id).single(); if(!u) return alert('User not found.'); let newScore = parseInt(u.rating_points) + parseInt(amt); if(newScore < 0) newScore = 0; await sb.from('app_users').update({ rating_points: newScore }).eq('user_id', id); alert('Rating updated!'); el('tb-admin').click(); };
window.adminClearRoomPrompt = async () => { const id = prompt('Enter Room ID to clear messages:'); if(!confirm('Are you sure? This will delete ALL messages in this room.')) return; await sb.from('public_messages').delete().eq('room_id', id); alert('Messages cleared!'); if(currentRoom == id) loadMessages(); };
window.adminDeleteRoomPrompt = async () => { const id = prompt('Enter Room ID to delete:'); if(id == 1 || id == 2 || id == 3) return alert('Cannot delete system rooms (1, 2, 3).'); if(!confirm('Are you sure?')) return; await sb.from('public_messages').delete().eq('room_id', id); await sb.from('rooms').delete().eq('room_id', id); alert('Room deleted!'); joinRoom(1); };

function openModal(t,b,wide){el('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-card ${wide?'wide':''}"><span class="close-x" onclick="closeModal()">✕</span><h3 style="margin:0 0 16px;font-size:16px;">${t}</h3>${b}</div></div>`;}
function closeModal(){el('modal-root').innerHTML='';}

function showCtx(e, u, uid){
  e.stopPropagation();
  const m=document.createElement('div');
  m.className='ctx-menu';
  m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';
  m.innerHTML=`
    <div class="ctx-item" onclick="startNewPM('${escapeHtml(u)}');closeCtx();">💬 Private Message</div>
    <div class="ctx-item" onclick="viewProfile('${uid}');closeCtx();">👤 View Profile</div>
    <div class="ctx-item" onclick="addFriend('${escapeHtml(u)}');closeCtx();">➕ Add Friend</div>
    <div class="ctx-item" onclick="sendDotsPrompt('${uid}');closeCtx();">🪙 Send Dots</div>`;
  el('context-root').innerHTML='';el('context-root').appendChild(m);
}
function closeCtx(){el('context-root').innerHTML='';}
window.onclick=closeCtx;
</script>
