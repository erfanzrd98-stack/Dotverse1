<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dotverse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --bg:#fff; --ink:#14181f; --muted:#6b7280; --line:#e7e9ee; --dot:#3d5afe; --dot2:#5b7cfa; --dot-soft:#eef0ff; --danger:#e14b4b; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;font-family:"Tahoma","Arial",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
  .hidden{display:none!important;}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:#d4d8e2;border-radius:8px;}
  .auth-wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;overflow-y:auto;}
  .auth-card{width:100%;max-width:380px;border:1px solid var(--line);border-radius:20px;padding:32px 28px;background:#fff;box-shadow:0 24px 55px -20px rgba(20,24,31,.2);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;} .brand-dot{width:14px;height:14px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 4px var(--dot-soft);}
  .brand-name{font-size:20px;font-weight:700;} .auth-sub{color:var(--muted);font-size:13.5px;margin:0 0 24px;}
  .tabs{display:flex;gap:4px;margin-bottom:20px;background:#eceef5;border-radius:12px;padding:4px;} .tab{flex:1;text-align:center;padding:9px 0;font-size:13.5px;font-weight:600;border-radius:9px;cursor:pointer;color:var(--muted);} .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,24,31,.1);}
  label.field{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 6px;}
  input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:14.5px;outline:none;background:#fbfbfd;font-family:inherit;}
  input:focus,select:focus{border-color:var(--dot);background:#fff;}
  .btn{padding:13px 0;border:none;border-radius:13px;cursor:pointer;font-size:14.5px;font-weight:700;width:100%;background:linear-gradient(135deg,var(--dot),var(--dot2));color:#fff;margin-top:18px;font-family:inherit;box-shadow:0 6px 18px -6px rgba(61,90,254,.5);}
  .btn:active{transform:scale(.97);}
  .btn-sm{padding:9px 16px;font-size:12.5px;border-radius:10px;background:#f4f5f7;color:var(--ink);width:auto;margin:0;border:1px solid var(--line);font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-sm:active{transform:scale(.95);}
  .btn-danger{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff;} .auth-msg{font-size:13px;margin-top:12px;min-height:16px;color:var(--danger);}
  #app{height:100%; display:flex; flex-direction:column;} #shell{display:flex;flex-direction:column;height:100%;overflow:hidden;}
  #topbar-mobile{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0;overflow-x:auto;}
  .topbar-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:11px 4px 9px;cursor:pointer;color:var(--muted);min-width:45px;}
  .topbar-btn .tb-icon{font-size:20px;} .topbar-btn .tb-label{display:none;} .topbar-btn.hidden{display:none;}
  #main{flex:1;display:flex;flex-direction:column;min-height:0;}
  #broadcast-root{background:#fffae6; color:#b45309; text-align:center; padding:8px 15px; font-size:12.5px; border-bottom:1px solid var(--line); font-weight:600;}
  #room-header{display:flex;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);flex-shrink:0;align-items:center;}
  #room-header .rtitle{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;} #room-header .rscore{font-size:12px;color:var(--muted);}
  #messages{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;min-height:0;}
  .msg{display:flex;gap:8px;align-items:flex-start;}
  .avatar-emoji{font-size:16px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--dot-soft);border-radius:50%;flex-shrink:0;cursor:pointer;overflow:hidden;}
  .avatar-sysbot{background:linear-gradient(135deg,#ca8a04,#fde047);}
  .avatar-nova{background:linear-gradient(135deg,#06b6d4,#22d3ee);}
  .avatar-img{width:100%;height:100%;object-fit:cover;}
  .msg-body{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;} .msg-name{font-size:13px;font-weight:700;cursor:pointer;} .msg-text{font-size:14px;word-break:break-word;}
  .sys-msg{text-align:center;color:var(--muted);font-size:12px;font-style:italic;margin:5px 0;}
  #composer{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);flex-shrink:0;} #composer input{flex:1;font-family:inherit;}
  #composer .btn-sm{background:var(--dot);color:#fff;border:none;border-radius:10px;padding:11px 22px;font-weight:800;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,18,30,.5);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px;overflow-y:auto;}
  .modal-card{background:#fff;border-radius:16px;width:100%;max-width:390px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px -12px rgba(15,18,30,.35);animation:mpop .16s ease;}
  .modal-card.wide{max-width:600px;}
  @keyframes mpop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .modal-head .mt{flex:1;min-width:0;font-size:16.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .modal-x{width:36px;height:36px;flex-shrink:0;border-radius:12px;border:1px solid var(--line);background:#f5f6f8;color:var(--muted);font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;font-family:inherit;padding:0;}
  .modal-x:hover{background:#fee2e2;color:#ef4444;border-color:#ef4444;}
  .modal-x:active{transform:scale(.88);}
  .modal-body{padding:18px;overflow-y:auto;}
  .close-x{display:none;}
  .list-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f2f3f7;font-size:14px;cursor:pointer;min-height:52px;}
  .list-row:active{background:#f8f9fd;border-radius:10px;}
  .list-row:last-child{border-bottom:none;}
  .ctx-menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 44px -8px rgba(20,24,31,.28);padding:6px;z-index:90;min-width:200px;animation:mpop .12s ease;}
  .ctx-item{padding:12px 14px;font-size:13.5px;font-weight:600;border-radius:10px;cursor:pointer;}
  .ctx-item:active{background:#f4f5f7;}
  .admin-bubble{background:#f8f9fc;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .admin-bubble-title{font-size:14px;font-weight:800;margin-bottom:12px;color:var(--ink);display:flex;align-items:center;gap:7px;}
  .admin-bubble-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .admin-bubble input{padding:10px 8px;border-radius:10px;border:1.5px solid var(--line);font-size:13.5px;background:#fff;text-align:center;width:100%;font-family:inherit;outline:none;}
  .admin-bubble button{padding:11px 18px;background:var(--dot);color:#fff;border:none;border-radius:10px;font-size:13px;cursor:pointer;font-weight:800;white-space:nowrap;font-family:inherit;}
  .admin-bubble button:active{transform:scale(.94);}
  .admin-bubble button.danger{background:#ef4444;}
  .admin-bubble button.success{background:#16a34a;}
  .admin-gift-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f2f3f7;}
  .admin-gift-row span.icon{font-size:20px;width:24px;text-align:center;}
  .admin-gift-row input{padding:6px;border-radius:7px;border:1.5px solid var(--line);font-size:12px;width:50px;text-align:center;}
  .p-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #f2f3f7;padding:12px 0;min-height:52px;}
  .p-row:last-child{border-bottom:none;}
  .p-label{width:110px;flex-shrink:0;font-size:13px;color:var(--muted);font-weight:600;text-align:left;}
  .p-val{flex:1;display:flex;justify-content:flex-end;align-items:center;min-width:0;}
  .p-input, .p-select{max-width:170px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;background:#fbfbfd;outline:none;text-align:right;font-family:inherit;}
  .p-bubble{background:var(--dot-soft);color:var(--dot);padding:7px 16px;border-radius:20px;font-weight:700;font-size:13px;text-align:center;white-space:nowrap;}
  .p-btn-row{display:flex;gap:10px;margin-top:18px;} .p-btn{flex:1;padding:12px;border:none;border-radius:12px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;}
  .p-btn:active{transform:scale(.96);}
  .p-btn-save{background:linear-gradient(135deg,var(--dot),var(--dot2));color:#fff;} .p-btn-logout{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
  .p-color-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:150px;} .p-color-opt{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;} .p-color-opt.selected{border-color:var(--ink);}
  #pm-popup-root{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:120;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .pm-popup-card{width:287px;box-shadow:2px 3px 8px rgba(0,0,0,0.45);display:flex;flex-direction:column;background:#fff;font-family:"Tahoma","Arial",sans-serif;}
  .pm-popup-header{height:23px;font-size:14px;padding:0 4px 0 0;display:flex;justify-content:space-between;align-items:center;direction:ltr;}
  .pm-popup-header span:first-child{padding-left:8px;display:flex;align-items:center;gap:4px;font-weight:bold;} .pm-popup-header img{width:16px;height:16px;border-radius:50%;vertical-align:middle;}
  .pm-popup-close{width:20px;height:23px;text-align:center;line-height:23px;font-weight:bold;font-size:13px;cursor:pointer;}
  .pm-popup-text{min-height:43px;font-size:11.5px;text-align:center;display:flex;align-items:center;justify-content:center;padding:0 8px;line-height:1.25;direction:ltr;}
  .pm-popup-actions{display:flex;height:26px;} .pm-popup-actions button{flex:1;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:bold;border:2px outset;} .pm-popup-actions button:active{border-style:inset;}
  .pm-popup-reply-box{display:flex;height:26px;} .pm-popup-reply-box input{flex:1;padding:2px 4px;border:none;font-size:12px;outline:none;font-family:inherit;background:#fff;} .pm-popup-reply-box button{width:60px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:bold;border:2px outset;}
  .pm-history-view{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;padding:12px;background:#f6f7fb;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;}
  .pm-history-msg{max-width:80%;padding:9px 13px;border-radius:13px;font-size:13px;word-break:break-word;color:#000;}
  .pm-modal-tabs{display:flex;gap:4px;margin-bottom:16px;background:#eceef5;border-radius:12px;padding:4px;} .pm-modal-tab{flex:1;text-align:center;padding:11px 4px;font-size:14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:700;min-height:44px;display:flex;align-items:center;justify-content:center;} .pm-modal-tab.active{background:#fff;color:var(--dot);box-shadow:0 2px 8px rgba(20,24,31,.09);}
  .friend-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f2f3f7;min-height:58px;}
  .friend-row:last-child{border-bottom:none;}
  .friend-info{display:flex;align-items:center;gap:11px;} .friend-av{font-size:21px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--dot-soft);border-radius:50%;overflow:hidden;flex-shrink:0;}
  .friend-name{font-weight:600;font-size:14.5px;} .friend-actions{display:flex;gap:5px;}
  .act-btn{border:none;background:#f1f2f6;width:36px;height:36px;border-radius:11px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .act-btn:active{transform:scale(.9);}
  .act-btn.danger{background:#fee2e2;color:#ef4444;} .act-btn.primary{background:var(--dot);color:#fff;}
  .lb-rank{width:24px; height:24px; background:linear-gradient(135deg,var(--dot),var(--dot2)); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:bold; flex-shrink:0;}
</style>
</head>
<body>

<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="brand-dot"></span><span class="brand-name">Dotverse</span></div>
    <p class="auth-sub">A tiny chat world. Ten seats. One dot at a time.</p>
    <div class="tabs"><div class="tab active" id="tab-login">Log in</div><div class="tab" id="tab-register">Register</div></div>
    <div id="form-login"><label class="field">Username</label><input type="text" id="login-username" /><label class="field">Password</label><input type="password" id="login-password" /><button class="btn" id="btn-login">Log in</button></div>
    <div id="form-register" class="hidden"><label class="field">Username</label><input type="text" id="reg-username" /><label class="field">Password</label><input type="password" id="reg-password" /><label class="field">Gender</label><select id="reg-gender"><option value="male">Male</option><option value="female">Female</option></select><label class="field">City</label><input type="text" id="reg-city" /><button class="btn" id="btn-register">Create account</button></div>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<div id="shell" class="hidden">
  <div id="topbar-mobile">
    <div class="topbar-btn" id="tb-profile"><span class="tb-icon">👤</span><span class="tb-label">Profile</span></div>
    <div class="topbar-btn" id="tb-pms"><span class="tb-icon">👥</span><span class="tb-label">Community</span></div>
    <div class="topbar-btn" id="tb-rooms"><span class="tb-icon">💬</span><span class="tb-label">Rooms</span></div>
    <div class="topbar-btn" id="tb-dots"><span class="tb-icon">🪙</span><span class="tb-label">Dots</span></div>
    <div class="topbar-btn" id="tb-search"><span class="tb-icon">🔍</span><span class="tb-label">Search</span></div>
    <div class="topbar-btn hidden" id="tb-admin"><span class="tb-icon">🛡️</span><span class="tb-label">Admin</span></div>
    <div class="topbar-btn" id="tb-roominfo"><span class="tb-icon">ℹ️</span><span class="tb-label">Room</span></div>
  </div>
  <div id="main">
    <div id="broadcast-root" class="hidden"></div>
    <div id="room-header"><div class="rtitle"><span id="room-title">Lobby</span><span class="rscore" id="room-meta">ID: 1</span></div></div>
    <div id="messages"></div>
    <div id="composer"><input type="text" id="msg-input" placeholder="Say something… (Type 'Bot' or 'بات' to ask Nova)" maxlength="500" /><button class="btn-sm" id="btn-send">Send</button></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="context-root"></div>
<div id="pm-popup-root"></div>

<script>
const SUPABASE_URL = "https://secsiftaabzbrfbaeaxn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlY3NpZnRhYWJ6YnJmYmFlYXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODY4NzIsImV4cCI6MjEwMTM2Mjg3Mn0.ZBFujtK74JZK6NsI5vGO_O733qY2rSsPmvnbBcZSxu4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ADMIN_GIF = "https://secsiftaabzbrfbaeaxn.supabase.co/storage/v1/object/public/Avatars/Dot.gif";
const SM_CROWN_URL = "https://secsiftaabzbrfbaeaxn.supabase.co/storage/v1/object/public/Avatars/SM.png";
const AI_WORKER_URL = "https://dotverse-nova.erfanzrd98.workers.dev/"; 

let currentUser = null, currentRoom = 1, msgSubscription = null, pmSubscription = null, broadcastSubscription = null, banCheckInterval = null, lastAiRequest = 0, novaAutoInterval = null, heartbeatInterval = null;
let sessionToken = localStorage.getItem('dv_session') || null;
const userCache = {}; 
const AVATARS = ["🦊","🦄","🐰","🐭","🍄","☢️","🌼","♥️","♠️","♣️","♦️","👺","👻","👽","⛄","💀","👤","🧑🏻‍🚀","🧒🏻","👩🏻","🍁","🍀","🌲","⚡","🐥","🛡️","♂️","♀️"];
const COLORS = ["#000000", "#ef4444", "#f97316", "#eab308", "#22c55e", "#06b6d4", "#3b82f6", "#8b5cf6", "#ec4899", "#6b7280", "#f5780e"];

function el(id){return document.getElementById(id);}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function showMsg(t,ok){const e=el('auth-msg');e.textContent=t;e.className='auth-msg '+(ok?'ok':'error');}

// ═══ RPC هلپر — همه‌ی عملیات‌ها از این میان ═══
async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args);
  if (error) { alert(error.message.replace(/^ERROR:\s*/,'')); throw error; }
  return data;
}

function getUserAvatar(u, uid) {
  if (!u) return '🙂';
  if (u.is_admin) return `<img src="${ADMIN_GIF}" class="avatar-img">`;
  if (uid === 4) return '🤖';
  if (uid === 3) return '⚙️';
  if (u.is_system || u.is_super_mod) return `<img src="${SM_CROWN_URL}" class="avatar-img">`;
  return u.avatar_url || '🙂';
}
function getAvExtra(uid) { return uid === 3 ? ' avatar-sysbot' : (uid === 4 ? ' avatar-nova' : ''); }

el('tab-login').onclick=()=>{el('tab-login').classList.add('active');el('tab-register').classList.remove('active');el('form-login').classList.remove('hidden');el('form-register').classList.add('hidden');showMsg('',true);};
el('tab-register').onclick=()=>{el('tab-register').classList.add('active');el('tab-login').classList.remove('active');el('form-register').classList.remove('hidden');el('form-login').classList.add('hidden');showMsg('',true);};

el('btn-register').onclick = async () => {
  const u=el('reg-username').value.trim(),p=el('reg-password').value,g=el('reg-gender').value,c=el('reg-city').value.trim();
  if(u.length < 3 || u.length > 14) return showMsg('Username must be 3-14 chars.');
  if(p.length < 3 || p.length > 14) return showMsg('Password must be 3-14 chars.');
  try {
    // ۱) ثبت‌نام + پروفایل
    const { data: user, error } = await sb.rpc('register_user', { p_username:u, p_password:p, p_gender:g, p_city:c });
    if (error) return showMsg(error.message);
    // ۲) نشست
    const { data: token, error: tokErr } = await sb.rpc('open_session', { p_username:u, p_password:p });
    if (tokErr) return showMsg(tokErr.message);
    sessionToken = token;
    localStorage.setItem('dv_session', token);
    currentUser = user; startApp();
  } catch(e) { showMsg('Network error.'); }
};

el('btn-login').onclick = async () => {
  const u=el('login-username').value.trim(),p=el('login-password').value;
  if(!u||!p) return showMsg('Enter credentials.');
  // ۱) توکن نشست
  const { data: token, error: tokErr } = await sb.rpc('open_session', { p_username:u, p_password:p });
  if (tokErr) return showMsg('Invalid username or password.');
  // ۲) پروفایل
  const { data: user, error: usrErr } = await sb.rpc('login_user', { p_username:u, p_password:p });
  if (usrErr) return showMsg('Error loading profile.');
  sessionToken = token;
  localStorage.setItem('dv_session', token);
  currentUser = user; startApp();
};

async function startApp(){
  el('auth-screen').classList.add('hidden'); el('shell').classList.remove('hidden');
  if(currentUser.is_admin || currentUser.is_super_mod) el('tb-admin').classList.remove('hidden');
  joinRoom(1); subscribeToPMs(); subscribeToBroadcasts(); startBanCheck(); startNovaAutoMessage(); startHeartbeat();
}

// رفرش موجودی بعد از عملیات‌ها
async function refreshCurrency(){
  const { data } = await sb.from('app_users').select('currency, rating_points, pm_color, pm_color_expires').eq('user_id', currentUser.user_id).single();
  if (data) { currentUser.currency = data.currency; currentUser.rating_points = data.rating_points; currentUser.pm_color = data.pm_color; currentUser.pm_color_expires = data.pm_color_expires; }
}

function startHeartbeat(){
  if (heartbeatInterval) clearInterval(heartbeatInterval);
  heartbeatInterval = setInterval(async () => {
    if (!currentUser || !sessionToken) return;
    try { await rpc('set_presence', { p_token: sessionToken, p_room_id: currentRoom }); } catch(e){}
  }, 30000);
}

function getPmColorScheme(user) {
  if (!user) return { card_border:'#6b7280', header_bg:'linear-gradient(#6b7280, #4b5563)', header_color:'#fff', close_bg:'#9ca3af', close_color:'#000', body_bg:'#e5e7eb', body_color:'#000', footer_bg:'linear-gradient(#6b7280, #4b5563)', footer_color:'#000', footer_border:'#6b7280' };
  if (user.is_admin) return { card_border:'#6b3200', header_bg:'linear-gradient(#a44600, #8c3d00)', header_color:'#fff', close_bg:'#ef6500', close_color:'#000', body_bg:'#ff7910', body_color:'#000', footer_bg:'linear-gradient(#a44600, #8c3d00)', footer_color:'#000', footer_border:'#a4600e' };
  if (user.user_id === 4) return { card_border:'#00e5ff', header_bg:'linear-gradient(#00e5ff, #00b8d4)', header_color:'#004d40', close_bg:'#00b8d4', close_color:'#000', body_bg:'#00e5ff', body_color:'#004d40', footer_bg:'linear-gradient(#00e5ff, #00b8d4)', footer_color:'#004d40', footer_border:'#00e5ff' };
  if (user.user_id === 3 || user.is_super_mod) return { card_border:'#ca8a04', header_bg:'linear-gradient(#ca8a04, #facc15)', header_color:'#3a2f02', close_bg:'#fde047', close_color:'#3a2f02', body_bg:'#fde047', body_color:'#3a2f02', footer_bg:'linear-gradient(#ca8a04, #facc15)', footer_color:'#3a2f02', footer_border:'#ca8a04' };
  if (user.pm_color && user.pm_color_expires && new Date(user.pm_color_expires) > new Date()) {
    if (user.pm_color === 'black') return { card_border:'#000', header_bg:'linear-gradient(#3a3a3a, #000000)', header_color:'#fff', close_bg:'#5a5a5a', close_color:'#fff', body_bg:'#1a1a1a', body_color:'#fff', footer_bg:'linear-gradient(#3a3a3a, #000000)', footer_color:'#fff', footer_border:'#000' };
    if (user.pm_color === 'jade') return { card_border:'#0F3D2E', header_bg:'linear-gradient(#0F3D2E, #6ED1AC)', header_color:'#fff', close_bg:'#A8ECD0', close_color:'#0f3d2e', body_bg:'#A8ECD0', body_color:'#0f3d2e', footer_bg:'linear-gradient(#0F3D2E, #6ED1AC)', footer_color:'#fff', footer_border:'#0F3D2E' };
    if (user.pm_color === 'olive') return { card_border:'#3A3B14', header_bg:'linear-gradient(#3A3B14, #B0B25E)', header_color:'#fff', close_bg:'#D4D69C', close_color:'#2b2c10', body_bg:'#D4D69C', body_color:'#2b2c10', footer_bg:'linear-gradient(#3A3B14, #B0B25E)', footer_color:'#fff', footer_border:'#3A3B14' };
  }
  let score = user.rating_points || 0; let gender = user.gender || 'male';
  if (score <= 100) return gender === 'female' ? { card_border:'#6B1A38', header_bg:'linear-gradient(#6B1A38, #E38FAE)', header_color:'#4a0f22', close_bg:'#FBD3E0', close_color:'#4a0f22', body_bg:'#FBD3E0', body_color:'#4a0f22', footer_bg:'linear-gradient(#6B1A38, #E38FAE)', footer_color:'#4a0f22', footer_border:'#6B1A38' } : { card_border:'#1B3A66', header_bg:'linear-gradient(#1B3A66, #6FA3E0)', header_color:'#12233d', close_bg:'#C9E0FB', close_color:'#12233d', body_bg:'#C9E0FB', body_color:'#12233d', footer_bg:'linear-gradient(#1B3A66, #6FA3E0)', footer_color:'#12233d', footer_border:'#1B3A66' };
  if (score <= 200) return gender === 'female' ? { card_border:'#4A0026', header_bg:'linear-gradient(#4A0026, #A80058)', header_color:'#fff', close_bg:'#B8106A', close_color:'#fff', body_bg:'#B8106A', body_color:'#fff', footer_bg:'linear-gradient(#4A0026, #A80058)', footer_color:'#fff', footer_border:'#4A0026' } : { card_border:'#081428', header_bg:'linear-gradient(#081428, #173B72)', header_color:'#fff', close_bg:'#1B4FA0', close_color:'#fff', body_bg:'#1B4FA0', body_color:'#fff', footer_bg:'linear-gradient(#081428, #173B72)', footer_color:'#fff', footer_border:'#081428' };
  if (score <= 500) return { card_border:'#4A1216', header_bg:'linear-gradient(#4A1216, #B14A53)', header_color:'#fff', close_bg:'#C1414B', close_color:'#fff', body_bg:'#C1414B', body_color:'#fff', footer_bg:'linear-gradient(#4A1216, #B14A53)', footer_color:'#fff', footer_border:'#4A1216' };
  if (score <= 1000) return { card_border:'#33224F', header_bg:'linear-gradient(#33224F, #A98FE0)', header_color:'#2b1c47', close_bg:'#D4C4F2', close_color:'#2b1c47', body_bg:'#D4C4F2', body_color:'#2b1c47', footer_bg:'linear-gradient(#33224F, #A98FE0)', footer_color:'#2b1c47', footer_border:'#33224F' };
  if (score <= 1500) return { card_border:'#1F1240', header_bg:'linear-gradient(#1F1240, #7C4FE0)', header_color:'#fff', close_bg:'#5C2FB0', close_color:'#fff', body_bg:'#5C2FB0', body_color:'#fff', footer_bg:'linear-gradient(#1F1240, #7C4FE0)', footer_color:'#fff', footer_border:'#1F1240' };
  if (score <= 2000) return { card_border:'#0B3D3D', header_bg:'linear-gradient(#0B3D3D, #6FD4D4)', header_color:'#0b3d3d', close_bg:'#A8EBEB', close_color:'#0b3d3d', body_bg:'#A8EBEB', body_color:'#0b3d3d', footer_bg:'linear-gradient(#0B3D3D, #6FD4D4)', footer_color:'#0b3d3d', footer_border:'#0B3D3D' };
  return { card_border:'#B0B0B0', header_bg:'linear-gradient(#B0B0B0, #EFEFEF)', header_color:'#1a1a1a', close_bg:'#FFFFFF', close_color:'#1a1a1a', body_bg:'#FFFFFF', body_color:'#1a1a1a', footer_bg:'linear-gradient(#B0B0B0, #EFEFEF)', footer_color:'#1a1a1a', footer_border:'#B0B0B0' };
}

function getRatingTier(score) {
  if (score <= 100) return 'Spark';
  if (score <= 200) return 'Pulse';
  if (score <= 500) return 'Comet';
  if (score <= 1000) return 'Orbit';
  if (score <= 1500) return 'Nova';
  if (score <= 2000) return 'Nebula';
  return 'Galaxy';
}

function startBanCheck() { if (banCheckInterval) clearInterval(banCheckInterval); checkBanStatus(); banCheckInterval = setInterval(checkBanStatus, 5000); }
async function checkBanStatus() {
  if (!currentUser) return;
  const { data: u } = await sb.from('app_users').select('banned_until, ban_fine, current_room_id').eq('user_id', currentUser.user_id).single();
  if (!u) return;
  const wasBanned = new Date(currentUser.banned_until) > new Date();
  const isBannedNow = new Date(u.banned_until) > new Date();
  if (!wasBanned && isBannedNow) { currentUser.banned_until = u.banned_until; currentUser.ban_fine = u.ban_fine; alert('You have been banned!'); joinRoom(3); } 
  else if (wasBanned && !isBannedNow && currentRoom === 3) { currentUser.banned_until = u.banned_until; alert('You have been unbanned!'); joinRoom(1); } 
  else { currentUser.ban_fine = u.ban_fine; }
}

function subscribeToBroadcasts() {
  if (broadcastSubscription) sb.removeChannel(broadcastSubscription);
  sb.from('broadcasts').select('*').gt('expires_at', new Date().toISOString()).then(({ data }) => { if (data && data.length > 0) showBroadcast(data[0]); });
  broadcastSubscription = sb.channel('broadcasts').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'broadcasts' }, payload => showBroadcast(payload.new)).subscribe();
}
function showBroadcast(b) {
  const now = new Date(); const expires = new Date(b.expires_at); if (expires < now) return;
  const root = el('broadcast-root'); root.innerHTML = `📢 ${escapeHtml(b.content)}`; root.classList.remove('hidden');
  setTimeout(() => { root.classList.add('hidden'); root.innerHTML = ''; }, expires.getTime() - now.getTime());
}

async function joinRoom(id){
  closeModal();
  if (id === 2 && currentUser.user_id !== 1 && currentUser.user_id !== 3) {
    // VIP از طریق RPC امن
    try { await rpc('join_vip_room', { p_token: sessionToken }); alert('Welcome to VIP Room!'); }
    catch(e) { return; }
  }

  try { await rpc('set_presence', { p_token: sessionToken, p_room_id: id }); } catch(e) {}

  currentRoom = id; if (msgSubscription) await sb.removeChannel(msgSubscription);
  const { data: room } = await sb.from('rooms').select('*').eq('room_id', id).single();
  if (room) { el('room-title').textContent = room.name; el('room-meta').textContent = 'ID: ' + room.room_id + ' · ' + room.rating_points + ' pts'; }
  await loadMessages();

  const isBanned = new Date(currentUser.banned_until) > new Date();
  if (id === 3 && isBanned) {
    el('composer').classList.add('hidden'); const banDiv = document.createElement('div'); banDiv.id = 'ban-banner';
    banDiv.style.cssText = 'text-align:center; padding:30px 20px; background:#fee2e2; color:#ef4444; font-weight:bold;';
    banDiv.innerHTML = `You are banned! Pay ${currentUser.ban_fine} Ð fine to leave.<br><button class="btn btn-danger" style="margin-top:15px;" onclick="payFine()">Pay Fine</button>`;
    el('main').appendChild(banDiv);
  } else { el('composer').classList.remove('hidden'); const banBanner = el('ban-banner'); if(banBanner) banBanner.remove(); }
  
  msgSubscription = sb.channel('public:public_messages:room_id=eq.' + id).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'public_messages', filter: `room_id=eq.${id}` }, payload => appendMessage(payload.new, true)).subscribe();
}
async function loadMessages(){
  const { data } = await sb.from('public_messages').select('*, sender:app_users(username, avatar_url, id_color, is_admin, is_system, is_super_mod)').eq('room_id', currentRoom).order('created_at', { ascending: true }).limit(50);
  const w = el('messages'); w.innerHTML = ''; if (data) data.forEach(m => appendMessage(m, false)); w.scrollTop = w.scrollHeight;
}
async function getUserData(userId) {
  const cached = userCache[userId]; const now = Date.now();
  if (cached && cached._ts && (now - cached._ts < 15000)) return cached;
  const { data } = await sb.from('app_users').select('user_id, username, avatar_url, id_color, is_admin, is_system, is_super_mod, rating_points, gender, pm_color, pm_color_expires').eq('user_id', userId).single();
  userCache[userId] = data || { username: 'Unknown', avatar_url: '🙂', id_color: '#000' }; userCache[userId]._ts = now; return userCache[userId];
}
async function appendMessage(m, isRealtime){
  const w = el('messages'); const div = document.createElement('div');
  if (!m.user_id) { div.className = 'sys-msg'; div.textContent = m.content; w.appendChild(div); if (isRealtime) w.scrollTop = w.scrollHeight; return; }

  let uData = m.sender || m.app_users;
  if (m.user_id === currentUser.user_id) { uData = { username: currentUser.username, avatar_url: currentUser.avatar_url, id_color: currentUser.id_color, is_admin: currentUser.is_admin, is_system: currentUser.is_system, is_super_mod: currentUser.is_super_mod }; } 
  else if (!uData && m.user_id) { uData = await getUserData(m.user_id); }
  const userId = m.user_id; const username = uData ? uData.username : (m.username || 'Unknown');
  
  const avatarHtml = getUserAvatar(uData, userId);
  const nameColor = uData ? (uData.id_color || '#000') : '#000';
  div.className = 'msg';
  div.innerHTML = `<span class="avatar-emoji${getAvExtra(userId)}" onclick="showCtx(event,'${escapeHtml(username)}', '${userId}')">${avatarHtml}</span><div class="msg-body"><span class="msg-name" style="color:${nameColor}" onclick="showCtx(event,'${escapeHtml(username)}', '${userId}')">${escapeHtml(username)}</span><span class="msg-text">${escapeHtml(m.content)}</span></div>`;
  w.appendChild(div); if (isRealtime) w.scrollTop = w.scrollHeight;
}

async function handleAiPrompt(text) {
  const now = Date.now();
  if (now - lastAiRequest < 5000) return alert('Please wait 5 seconds before asking Nova again.');
  lastAiRequest = now;
  try {
    const res = await fetch(AI_WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: text }) });
    const data = await res.json();
    if (data.error) return alert('Nova Error: ' + data.error);
    return data.reply;
  } catch (e) { return alert('Failed to connect to Nova.'); }
}

function startNovaAutoMessage() {
  if (novaAutoInterval) clearInterval(novaAutoInterval);
  novaAutoInterval = setInterval(async () => {
    try {
      const { data: locked } = await sb.rpc('try_lock_nova', { p_token: sessionToken });
      if (!locked) return;
      const res = await fetch(AI_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: "Generate a short, interesting, random thought, fact, or philosophical question to start a conversation in the chat room. Just output the text, nothing else." })
      });
      const data = await res.json();
      if (data.reply) {
        await rpc('insert_ai_reply', { p_token: sessionToken, p_room_id: 1, p_content: data.reply });
      }
    } catch (e) { console.error('Nova auto error', e); }
  }, 60000);
}

el('btn-send').onclick = async () => {
  if (new Date(currentUser.banned_until) > new Date()) return alert('You are banned and cannot send messages.');
  const t = el('msg-input').value.trim(); if (!t) return; el('msg-input').value = '';
  const lowerT = t.toLowerCase();
  let isAi = false, promptText = t;
  if (lowerT.startsWith('bot ')) { isAi = true; promptText = t.substring(4); }
  else if (lowerT.startsWith('بات ')) { isAi = true; promptText = t.substring(4); }

  // ✅ پیام عمومی از RPC امن
  try { await rpc('send_public_message', { p_token: sessionToken, p_room_id: currentRoom, p_content: t }); }
  catch(e) { return; }

  const { data: room } = await sb.from('rooms').select('rating_points').eq('room_id', currentRoom).single();
  if (room) { el('room-meta').textContent = 'ID: ' + currentRoom + ' · ' + room.rating_points + ' pts'; }

  if (isAi) {
    const aiReply = await handleAiPrompt(promptText);
    if (aiReply) { 
      try { await rpc('insert_ai_reply', { p_token: sessionToken, p_room_id: currentRoom, p_content: aiReply }); } catch(e){}
    }
  }
};

function openPMPopup(sender, text, senderData) {
  const c = getPmColorScheme(senderData);
  const popupId = 'pm-' + Date.now() + Math.random().toString(36).substr(2,5);
  const popup = document.createElement('div'); popup.className = 'pm-popup-card'; popup.id = popupId; popup.style.border = '1px solid ' + c.card_border;
  
  const senderAvatar = senderData.user_id === 4 ? '🤖' : (senderData.user_id === 3 ? '⚙️' : '');
  
  let html = `<div class="pm-popup-header" style="background:${c.header_bg}; color:${c.header_color};"><span>${senderAvatar} ${escapeHtml(sender)}</span><div class="pm-popup-close" style="background:${c.close_bg}; color:${c.close_color};" onclick="document.getElementById('${popupId}').remove()">✕</div></div><div class="pm-popup-text" style="background:${c.body_bg}; color:${c.body_color};">${escapeHtml(text)}</div><div class="pm-popup-actions" id="actions-${popupId}"><button style="background:${c.footer_bg}; color:${c.footer_color}; border-color:${c.footer_border};" onclick="showReplyBox('${popupId}', '${escapeHtml(sender)}')">Reply</button><button style="background:${c.footer_bg}; color:${c.footer_color}; border-color:${c.footer_border};" onclick="viewProfile('${senderData.user_id}'); document.getElementById('${popupId}').remove();">About user</button></div><div class="pm-popup-reply-box hidden" id="reply-${popupId}"><input type="text" id="input-${popupId}" placeholder="Type reply..." /><button style="background:${c.footer_bg}; color:${c.footer_color}; border-color:${c.footer_border};" onclick="sendReply('${escapeHtml(sender)}', '${popupId}')">Send</button></div>`;
  popup.innerHTML = html; el('pm-popup-root').appendChild(popup);
}
function showReplyBox(popupId, sender) {
  document.getElementById(`actions-${popupId}`).classList.add('hidden');
  document.getElementById(`reply-${popupId}`).classList.remove('hidden');
  const inp = document.getElementById(`input-${popupId}`); inp.focus(); inp.addEventListener('keydown', e => { if(e.key==='Enter') sendReply(sender, popupId); });
}
async function sendReply(sender, popupId) {
  const inp = document.getElementById(`input-${popupId}`); const t = inp.value.trim(); if(!t) return;
  const { data: receiver } = await sb.from('app_users').select('user_id').eq('username', sender).single();
  if(receiver) {
    // ✅ PM از RPC امن
    try { await rpc('send_private_message', { p_token: sessionToken, p_receiver_id: receiver.user_id, p_content: t }); } catch(e){ return; }
    const lowerT = t.toLowerCase();
    if ((lowerT.startsWith('bot ') || lowerT.startsWith('بات ')) && sender === 'Nova') {
      const aiReply = await handleAiPrompt(t.substring(4));
      if (aiReply) { 
        try { await rpc('insert_ai_reply_pm', { p_token: sessionToken, p_to_user_id: currentUser.user_id, p_content: aiReply }); } catch(e){}
      }
    }
    document.getElementById(popupId).remove(); 
  } else { alert('User not found'); }
}

async function loadPMHistory() {
  const { data: sent } = await sb.from('private_messages').select('receiver_id').eq('sender_id', currentUser.user_id).limit(50);
  const { data: received } = await sb.from('private_messages').select('sender_id').eq('receiver_id', currentUser.user_id).limit(50);
  const userIds = new Set(); sent.forEach(m => userIds.add(m.receiver_id)); received.forEach(m => userIds.add(m.sender_id));
  userIds.delete(currentUser.user_id); userIds.delete(1); userIds.delete(3); userIds.delete(4);
  let historyHtml = '<p style="color:var(--muted);text-align:center;font-size:13px;padding:20px 0;">No history yet.</p>';

    const { data: users } = await sb.from('app_users').select('user_id, username, avatar_url, is_admin, is_system, is_super_mod').in('user_id', Array.from(userIds));

    }

  el('comm-history').innerHTML = historyHtml;
}

window.sendPMFromHistory = async (otherUserId, otherUsername) => { 
  const inp = document.getElementById('pm-history-input'); const t = inp.value.trim(); if(!t) return;

window.openRPSModal = () => { openModal('Rock Paper Scissors', `<p style="font-size:13px; color:var(--muted); text-align:center; margin-bottom:15px;">Win 2x your bet.</p><label class="field">Bet Amount (Ð)</label><input type="number" id="rps-amt" value="1" step="0.01" min="0.01" style="width:100%; padding:11px 13px; border-radius:11px; border:1.5px solid var(--line); margin-bottom:15px;" /><div style="display:flex; gap:10px;"><button class="btn" style="background:#f4f5f7; color:var(--ink); font-size:24px;" onclick="playRPS('rock')">✊</button><button class="btn" style="background:#f4f5f7; color:var(--ink); font-size:24px;" onclick="playRPS('paper')">✋</button><button class="btn" style="background:#f4f5f7; color:var(--ink); font-size:24px;" onclick="playRPS('scissors')">✌️</button></div><div id="rps-res" style="text-align:center; font-weight:bold; margin-top:15px; font-size:14px;"></div>`); };
window.playRPS = async (choice) => { const amt = parseFloat(document.getElementById('rps-amt').value); if(!amt || amt <= 0) return alert('Invalid bet.'); try { const r = await rpc('play_rps', { p_token: sessionToken, p_choice: choice, p_amount: amt }); await refreshCurrency(); const icons = { rock: '✊', paper: '✋', scissors: '✌️' }; const res = document.getElementById('rps-res'); res.innerHTML = `You: ${icons[choice]} | Bot: ${icons[r.bot_choice]}<br>${r.outcome === 'tie' ? 'TIE!' : r.outcome === 'win' ? 'WIN! +' + r.payout + ' Ð' : 'LOST!'}`; res.style.color = r.outcome === 'tie' ? '#ca8a04' : (r.outcome === 'win' ? '#16a34a' : '#ef4444'); } catch(e){} };
window.openTransferDotsModal = () => { openModal('Send Dots',`<label class="field">Recipient ID Number</label><input type="number" id="td-to" placeholder="e.g. 2" /><label class="field">Amount (Ð)</label><input type="number" id="td-amt" placeholder="e.g. 1.50" step="0.01" min="0.01" /><p style="font-size:12px;color:var(--muted);margin-top:5px;">10% tax. Receiver gets 90%.</p><button class="btn" onclick="transferDots()">Send</button>`); };
window.transferDots = async () => { const toId = parseInt(el('td-to').value); const amt = parseFloat(el('td-amt').value); if(!toId || !amt || amt <= 0) return alert('Invalid input.'); if(toId === currentUser.user_id) return alert('Cannot send to yourself.'); try { const got = await rpc('transfer_dots', { p_token: sessionToken, p_to_id: toId, p_amount: amt }); await refreshCurrency(); alert(`Sent ${amt}Ð to #${toId}. They got ${got}Ð.`); closeModal(); el('tb-dots').click(); } catch(e){} };
window.sendDotsPrompt = (id) => { openTransferDotsModal(); el('td-to').value = id; };
window.refreshBalance = async (e) => { if(e) e.stopPropagation(); await refreshCurrency(); el('tb-dots').click(); };
window.sendBroadcast = async () => { const text = el('bc-text').value.trim(); if (!text) return alert('Enter a message.'); const settings = await getTreasury(); const fee = parseFloat(settings.broadcast_fee); if (currentUser.currency < fee) return alert(`Costs ${fee} Ð. Not enough dots.`); if (!confirm(`This will cost ${fee} Ð. Proceed?`)) return; try { await rpc('send_broadcast', { p_token: sessionToken, p_content: text }); await refreshCurrency(); alert('Broadcast sent! It will appear shortly.'); closeModal(); el('tb-dots').click(); } catch(e){} };

el('tb-profile').onclick = () => {
  const isMaster = currentUser.is_admin;
  let avHtml = isMaster ? `<img src="${ADMIN_GIF}" class="avatar-img">` : `<select id="p-avatar" class="p-select" onchange="window._av=this.value">${AVATARS.map(a => `<option value="${a}" ${currentUser.avatar_url===a?'selected':''}>${a}</option>`).join('')}</select>`;
  let coHtml = `<div class="p-color-grid">${COLORS.map(c => `<span class="p-color-opt ${currentUser.id_color===c?'selected':''}" style="background:${c}" onclick="selColor('${c}', this)"></span>`).join('')}</div>`;
  let genderHtml = `<select id="p-gender" class="p-select" onchange="window._gender=this.value"><option value="male" ${currentUser.gender==='male'?'selected':''}>Male</option><option value="female" ${currentUser.gender==='female'?'selected':''}>Female</option></select>`;
  let verifyHtml = ''; if (currentUser.is_verified) verifyHtml = `<span class="p-bubble" style="background:#dcfce7;color:#16a34a;">Verified ✔</span>`; else if (currentUser.verification_requested) verifyHtml = `<span class="p-bubble" style="background:#fef9c3;color:#ca8a04;">Pending...</span>`; else verifyHtml = `<button class="p-btn p-btn-save" style="width:100px;font-size:12px;margin:0;" onclick="requestVerification()">Request</button>`;
  openModal('👤 Your Profile',`<div style="max-width:320px;margin:0 auto;"><div class="p-row"><span class="p-label">Username</span><div class="p-val"><input type="text" id="p-username" class="p-input" value="${escapeHtml(currentUser.username)}"></div></div><div class="p-row"><span class="p-label">Old Password</span><div class="p-val"><input type="password" id="p-oldpass" class="p-input" placeholder="current"></div></div><div class="p-row"><span class="p-label">New Password</span><div class="p-val"><input type="password" id="p-password" class="p-input" placeholder="••••••"></div></div><div class="p-row"><span class="p-label">Gender</span><div class="p-val">${genderHtml}</div></div><div class="p-row"><span class="p-label">City</span><div class="p-val"><input type="text" id="p-city" class="p-input" value="${escapeHtml(currentUser.city||'')}"></div></div><div class="p-row"><span class="p-label">Avatar</span><div class="p-val">${avHtml}</div></div><div class="p-row"><span class="p-label">Name color</span><div class="p-val">${coHtml}</div></div><div class="p-row"><span class="p-label">Verify ID</span><div class="p-val">${verifyHtml}</div></div><div class="p-row"><span class="p-label">ID Number</span><div class="p-val"><span class="p-bubble">#${currentUser.user_id}</span></div></div><div class="p-btn-row"><button class="p-btn p-btn-logout" onclick="doLogout()">Logout</button><button class="p-btn p-btn-save" onclick="saveProfile()">Save Changes</button></div></div>`);
  window._av = currentUser.avatar_url || '🙂'; window._co = currentUser.id_color || '#000000'; window._gender = currentUser.gender || 'male';
};
window.doLogout = async () => { try { await sb.rpc('close_session', { p_token: sessionToken }); } catch(e){} localStorage.removeItem('dv_session'); location.reload(); };
window.requestVerification = async () => { const { data } = await sb.from('app_users').update({ verification_requested: true }).eq('user_id', currentUser.user_id).select().single(); currentUser = data; alert('Request sent!'); el('tb-profile').click(); };
window.selColor = (c, e) => { window._co = c; e.parentElement.querySelectorAll('.p-color-opt').forEach(x => x.classList.remove('selected')); e.classList.add('selected'); };
window.saveProfile = async () => { let finalAvatar = window._av; if(currentUser.is_admin) finalAvatar = ADMIN_GIF; const newUsername = el('p-username').value.trim(); const oldPassword = el('p-oldpass') ? el('p-oldpass').value : ''; const newPassword = el('p-password').value; if(newUsername.length < 3 || newUsername.length > 14) return alert('Username must be 3-14 chars.'); if(newPassword && (newPassword.length < 3 || newPassword.length > 14)) return alert('Password must be 3-14 chars.'); if(newPassword && !oldPassword) return alert('Enter current password too.');
  if(newPassword) { const { error: passErr } = await sb.rpc('change_password', { p_user_id: currentUser.user_id, p_old_password: oldPassword, p_new_password: newPassword }); if (passErr) return alert('Password error: ' + passErr.message); }
  const updates = { username: newUsername, gender: window._gender, city: el('p-city').value.trim(), id_color: window._co, avatar_url: finalAvatar };
  const { data } = await sb.from('app_users').update(updates).eq('user_id', currentUser.user_id).select().single(); currentUser = data; userCache[currentUser.user_id] = { username: currentUser.username, avatar_url: currentUser.avatar_url, id_color: currentUser.id_color, _ts: Date.now() }; alert('Saved!'); closeModal(); };

// --- Rooms (ساخت اتاق RPC) ---
el('tb-rooms').onclick = async () => {
  const { data } = await sb.from('rooms').select('*').order('rating_points', { ascending: false });
  let rows = '<button class="btn" style="margin-bottom:15px;" onclick="showMyRooms()">👑 My Rooms</button>';
  data.forEach(r => { const icon = r.room_id === 1 ? '💬' : r.room_id === 2 ? '⭐' : r.room_id === 3 ? '🚫' : '🏠'; rows += `<div class="list-row" onclick="joinRoom(${r.room_id})"><span>${icon}</span><span style="flex:1;font-weight:600;">${escapeHtml(r.name)}</span><span style="color:var(--muted)">${r.rating_points} pts</span></div>`; });
  rows += `<button class="btn" style="margin-top:16px;" onclick="createRoomPrompt()">➕ Create Room (10 Ð)</button>`;
  openModal('Chat Rooms', rows);
};
window.showMyRooms = async () => {
  const { data: ownedRooms } = await sb.from('rooms').select('*').or(`creator_id.eq.${currentUser.user_id},owner_id.eq.${currentUser.user_id}`);
  const { data: modRooms } = await sb.from('room_moderators').select('room_id').eq('user_id', currentUser.user_id);
  let html = '<div style="font-size:14px; font-weight:bold; margin-bottom:10px;">My Rooms (Creator/Owner)</div>';
  if (ownedRooms && ownedRooms.length > 0) { html += ownedRooms.map(r => `<div class="list-row" onclick="joinRoom(${r.room_id})"><span>👑</span><span style="flex:1;font-weight:600;">${escapeHtml(r.name)}</span><span style="color:var(--muted)">#${r.room_id}</span></div>`).join(''); } else { html += '<p style="color:var(--muted);font-size:12px;">None.</p>'; }
  html += '<div style="font-size:14px; font-weight:bold; margin-top:20px; margin-bottom:10px;">Moderator Rooms</div>';
  if (modRooms && modRooms.length > 0) { const { data: roomsInfo } = await sb.from('rooms').select('*').in('room_id', modRooms.map(m => m.room_id)); html += roomsInfo.map(r => `<div class="list-row" onclick="joinRoom(${r.room_id})"><span>🛡️</span><span style="flex:1;font-weight:600;">${escapeHtml(r.name)}</span><span style="color:var(--muted)">#${r.room_id}</span></div>`).join(''); } else { html += '<p style="color:var(--muted);font-size:12px;">None.</p>'; }
  openModal('👑 My Rooms', html);
};
window.createRoomPrompt = async () => { const name = prompt('Enter new room name:'); if(!name) return; try { const id = await rpc('create_room', { p_token: sessionToken, p_name: name }); await refreshCurrency(); alert('Room created!'); closeModal(); joinRoom(id); } catch(e){} };

el('tb-roominfo').onclick = async () => { const { data: room, error } = await sb.from('rooms').select('*').eq('room_id', currentRoom).single(); if (error || !room) return alert('Could not fetch room info.'); const { data: creator } = await sb.from('app_users').select('username').eq('user_id', room.creator_id).single(); const { data: owner } = await sb.from('app_users').select('username').eq('user_id', room.owner_id).single(); const { data: mods } = await sb.from('room_moderators').select('user_id').eq('room_id', currentRoom); let modsHtml = '<p style="color:var(--muted);font-size:12px;">None</p>'; if (mods && mods.length > 0) { const { data: modUsers } = await sb.from('app_users').select('user_id, username').in('user_id', mods.map(m => m.user_id)); if (modUsers && modUsers.length > 0) { modsHtml = modUsers.map(m => `<div class="list-row" style="cursor:default; border-bottom:none;"><span style="flex:1; font-weight:600;">${escapeHtml(m.username)} (ID: ${m.user_id})</span>${(room.creator_id === currentUser.user_id || room.owner_id === currentUser.user_id) ? `<button class="act-btn danger" onclick="removeModerator(${m.user_id})">➖</button>` : ''}</div>`).join(''); } } const canManage = room.creator_id === currentUser.user_id || room.owner_id === currentUser.user_id; const isCreator = room.creator_id === currentUser.user_id; let html = `<div class="list-row"><span style="flex:1;color:var(--muted);">Name</span><b>${escapeHtml(room.name)}</b></div><div class="list-row"><span style="flex:1;color:var(--muted);">Room ID</span><b>#${room.room_id}</b></div><div class="list-row"><span style="flex:1;color:var(--muted);">Score</span><b>${room.rating_points} pts</b></div><div class="list-row"><span style="flex:1;color:var(--muted);">Creator</span><b>${creator ? escapeHtml(creator.username) : 'Unknown'}</b></div><div class="list-row"><span style="flex:1;color:var(--muted);">Owner</span><b>${owner ? escapeHtml(owner.username) : 'Unknown'}</b></div><div style="margin-top:15px; font-size:13px; font-weight:700;">Moderators:</div><div style="border:1px solid var(--line); border-radius:8px; padding:5px 10px; margin-bottom:15px;">${modsHtml}</div>`; if (canManage) html += `<label class="field">Add Moderator (User ID)</label><div style="display:flex; gap:10px;"><input type="number" id="mod-id-input" placeholder="e.g. 5" style="flex:1;" /><button class="btn-sm" onclick="addModerator()">Add</button></div>`; if (isCreator) html += `<label class="field" style="margin-top:20px;">Transfer Ownership (User ID)</label><div style="display:flex; gap:10px;"><input type="number" id="owner-id-input" placeholder="e.g. 5" style="flex:1;" /><button class="btn-sm" onclick="transferOwnership()">Transfer</button></div>`; openModal('ℹ️ Room Info', html); };
window.addModerator = async () => { const id = parseInt(el('mod-id-input').value); if (!id) return alert('Enter a valid ID.'); const { data: target } = await sb.from('app_users').select('user_id').eq('user_id', id).single(); if (!target) return alert('User not found.'); const { error } = await sb.from('room_moderators').insert([{ room_id: currentRoom, user_id: id }]); if (error) return alert('Error or already a mod.'); alert('Moderator added!'); el('tb-roominfo').click(); };
window.removeModerator = async (uid) => { if (!confirm('Remove this moderator?')) return; await sb.from('room_moderators').delete().eq('room_id', currentRoom).eq('user_id', uid); alert('Removed!'); el('tb-roominfo').click(); };
window.transferOwnership = async () => { const id = parseInt(el('owner-id-input').value); if (!id) return alert('Enter a valid ID.'); if (id === currentUser.user_id) return alert('You are already the owner.'); const { data: target } = await sb.from('app_users').select('user_id').eq('user_id', id).single(); if (!target) return alert('User not found.'); const { error } = await sb.from('rooms').update({ owner_id: id }).eq('room_id', currentRoom); if (error) return alert('Error.'); alert('Ownership transferred!'); el('tb-roominfo').click(); };

el('tb-admin').onclick = async () => {
  if (!currentUser.is_admin && !currentUser.is_super_mod) return;
  const treasury = await getTreasury();
  const taxBal = treasury ? parseFloat(treasury.tax_balance).toFixed(2) : '0.00';
  const fundBal = treasury ? parseFloat(treasury.fund_balance).toFixed(2) : '0.00';
  let tabsHtml = `<div class="pm-modal-tabs">`;
  if (currentUser.is_super_mod && !currentUser.is_admin) {
    tabsHtml += `<div class="pm-modal-tab active" onclick="switchAdminTab('sm_ban', this)">🔨</div>`;

  if (currentUser.is_admin) { loadAdminRequests(); loadAdminGifts(); loadAdminSMs(); }
};
window.switchAdminTab = (tab, btn) => { document.querySelectorAll('.pm-modal-tab').forEach(t => t.classList.remove('active')); btn.classList.add('active'); ['requests','users','rooms','economy','super_mods','sm_ban'].forEach(t => { if(el(`admin-${t}`)) el(`admin-${t}`).classList.add('hidden'); }); if(el(`admin-${tab}`)) el(`admin-${tab}`).classList.remove('hidden'); };

// 🔑 تأیید رمز ادمین — یک‌بار می‌پرسه و ۵ دقیقه نگه می‌داره
let adminPassCache = null, adminPassTime = 0;
async function getAdminPass() {
  if (adminPassCache && Date.now() - adminPassTime < 5*60*1000) return adminPassCache;
  const p = prompt('Enter your admin password:');
  if (!p) return null;
  adminPassCache = p; adminPassTime = Date.now();
  return p;
}
async function adminRpc(name, extraArgs) {
  const pass = await getAdminPass();
  if (!pass) return null;
  try { await rpc(name, { p_token: sessionToken, p_pass: pass, ...extraArgs }); return true; }
  catch(e){ adminPassCache = null; return false; }
}

async function loadAdminRequests() {
  const { data: reqs } = await sb.from('app_users').select('user_id, username').eq('verification_requested', true);
  let html = '<div style="font-size:14px; font-weight:bold; margin-bottom:10px;">Verify ID Requests</div>';
  if (reqs && reqs.length > 0) { html += reqs.map(u => `<div class="friend-row" style="cursor:default;"><div class="friend-info"><span class="friend-av">🙂</span><span class="friend-name">${escapeHtml(u.username)} (#${u.user_id})</span></div><div class="friend-actions"><button class="btn-sm" style="background:#16a34a;color:#fff;border:none;" onclick="adminVerifyAction(${u.user_id}, true)">✔</button><button class="btn-sm" style="background:#ef4444;color:#fff;border:none;" onclick="adminVerifyAction(${u.user_id}, false)">✖</button></div></div>`).join(''); } else { html += '<p style="color:var(--muted);font-size:12px;">No pending requests.</p>'; }
  const { data: reports } = await sb.from('private_messages').select('id, content, sender:app_users(username)').eq('receiver_id', 1).ilike('content', '🚨%').order('created_at', { ascending: false }).limit(10);
  html += '<div style="font-size:14px; font-weight:bold; margin-top:20px; margin-bottom:10px;">User Reports</div>';
  if (reports && reports.length > 0) { html += reports.map(r => `<div class="list-row" style="cursor:default; flex-direction:column; align-items:flex-start;"><span style="font-weight:600;">From: ${r.sender ? r.sender.username : 'Unknown'}</span><span style="font-size:12px; color:var(--muted); margin-top:4px;">${escapeHtml(r.content.replace('🚨 REPORT: ', ''))}</span></div>`).join(''); } else { html += '<p style="color:var(--muted);font-size:12px;">No reports.</p>'; }
  el('admin-requests').innerHTML = html;
}
window.adminVerifyAction = async (id, is) => { if (await adminRpc('admin_set_verified', { p_target_id: id, p_is: is })) loadAdminRequests(); };
window.adminBanAction = async () => { const id = el('ban-id') ? el('ban-id').value : el('sm-ban-id').value; const mins = el('ban-mins') ? el('ban-mins').value : el('sm-ban-mins').value; const fine = el('ban-fine') ? el('ban-fine').value : el('sm-ban-fine').value; if(!id || !mins) return alert('User ID and minutes required.'); if (await adminRpc('admin_ban', { p_target_id: parseInt(id), p_minutes: parseInt(mins), p_fine: parseFloat(fine || 0) })) alert('User banned!'); };
window.adminUnbanAction = async () => { const id = el('unban-id') ? el('unban-id').value : el('sm-unban-id').value; if(!id) return alert('User ID required.'); if (await adminRpc('admin_unban', { p_target_id: parseInt(id) })) alert('User unbanned!'); };
window.adminSetRatingAction = async () => { const id = el('addrate-id').value; const amt = parseInt(el('addrate-amt').value); if(!id || isNaN(amt)) return alert('Required.'); if (await adminRpc('admin_set_rating', { p_target_id: parseInt(id), p_new_rating: amt })) alert('Rating set!'); };
window.adminResetPassAction = async () => { const id = el('reset-id').value; const newPass = el('reset-pass').value; if(!id || !newPass) return alert('Required.'); if (await adminRpc('admin_reset_pw', { p_target_id: parseInt(id), p_new_pass: newPass })) alert('Password reset!'); };
window.adminSetCurrencyAction = async () => { const id = el('dots-id').value; const amt = parseFloat(el('dots-amt').value); if(!id || isNaN(amt)) return alert('Required.'); if (await adminRpc('admin_set_currency', { p_target_id: parseInt(id), p_new_amount: amt })) alert('Dots set!'); };
window.adminFeesAction = async () => { const bc = el('bc-fee') ? el('bc-fee').value : -1; const vip = el('vip-fee') ? el('vip-fee').value : -1; const pmc = el('pm-color-cost') ? el('pm-color-cost').value : -1; if (await adminRpc('admin_set_fees', { p_broadcast_fee: parseFloat(bc), p_vip_fee: parseFloat(vip), p_pmcolor_cost: parseFloat(pmc) })) alert('Saved!'); };
window.adminMintAction = async () => { const amt = el('mint-amt').value; const target = el('mint-target').value; if(!amt) return alert('Enter amount.'); if (await adminRpc('admin_mint', { p_amount: parseFloat(amt), p_target: target })) { alert('Minted!'); el('tb-admin').click(); } };
window.adminBurnAction = async () => { const amt = el('burn-amt').value; const target = el('burn-target').value; if(!amt) return alert('Enter amount.'); if (await adminRpc('admin_burn', { p_amount: parseFloat(amt), p_target: target })) { alert('Burned!'); el('tb-admin').click(); } };
window.adminCreateCodeAction = async () => { const code = el('rc-code').value.trim(); const val = el('rc-val').value; const uses = el('rc-uses').value; if(!code || !val || !uses) return alert('All fields required.'); if (await adminRpc('admin_create_code', { p_code: code, p_value: parseFloat(val), p_max_uses: parseInt(uses) })) alert('Code created!'); };
window.adminSetSMAction = async (is) => { const id = el('sm-id').value; if(!id) return alert('Enter a User ID.'); if (await adminRpc('admin_set_supermod', { p_target_id: parseInt(id), p_is: is })) { alert('Done!'); el('tb-admin').click(); } };
window.adminClearRoomAction = async () => { const id = el('clear-id').value; if(!id) return alert('Room ID required.'); if (!confirm('Delete ALL messages in this room?')) return; if (await adminRpc('admin_clear_room', { p_room_id: parseInt(id) })) alert('Room cleared!'); };
window.adminDeleteRoomAction = async () => { const id = el('del-id').value; if(!id) return alert('Room ID required.'); if (parseInt(id) <= 3) return alert('Cannot delete system rooms (1-3).'); if (!confirm('Delete this room?')) return; if (await adminRpc('admin_clear_room', { p_room_id: parseInt(id) })) alert('Room deleted!'); };
async function loadAdminGifts() {
  const { data: gifts } = await sb.from('gifts').select('*').order('name');
  if (!gifts || gifts.length === 0) { if (el('admin-gifts-list')) el('admin-gifts-list').innerHTML = '<p style="color:var(--muted);font-size:12px;">No gifts.</p>'; return; }
  el('admin-gifts-list').innerHTML = gifts.map(g => `<div class="admin-gift-row"><span class="icon">${g.image_url}</span><span style="flex:1; font-size:13px;">${escapeHtml(g.name)}</span><input type="number" value="${g.price}" onchange="adminUpdateGiftPrice('${g.id}', this.value)"><input type="number" value="${g.stock}" onchange="adminUpdateGiftStock('${g.id}', this.value)"></div>`).join('');
}
window.adminUpdateGiftPrice = async (id, price) => { const pass = await getAdminPass(); if (!pass) return; try { await sb.from('gifts').update({ price: parseFloat(price), sell_price: parseFloat(price) * 0.8 }).eq('id', id); } catch(e){} };
window.adminUpdateGiftStock = async (id, stock) => { try { await sb.from('gifts').update({ stock: parseInt(stock) }).eq('id', id); } catch(e){} };
async function loadAdminSMs() {
  const { data: sms } = await sb.from('app_users').select('user_id, username').eq('is_super_mod', true).neq('user_id', 4);
  let html = '';
  if (sms && sms.length > 0) { html = sms.map(s => `<div class="friend-row" style="cursor:default;"><div class="friend-info"><span class="friend-av">🛡️</span><span class="friend-name">${escapeHtml(s.username)} (#${s.user_id})</span></div></div>`).join(''); } else { html = '<p style="color:var(--muted);font-size:12px;">No super mods.</p>'; }
  if (el('sm-list')) el('sm-list').innerHTML = html;
}
  // --- منوی کاربر (About User اول) ---
function showCtx(e, name, uid) {
  e.preventDefault(); e.stopPropagation();
  const root = el('context-root'); root.innerHTML = '';
  const menu = document.createElement('div'); menu.className = 'ctx-menu';
  menu.style.left = Math.min(e.clientX, window.innerWidth - 210) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - 260) + 'px';
  const items = [
    { label: 'ℹ️ About User', action: () => viewProfile(parseInt(uid)) },
    { label: '💬 Send PM', action: () => { closeModal(); startNewPM(name); } },
    { label: '➕ Add Friend', action: () => { addFriend(name); } },
    { label: '🪙 Send Dots', action: () => { closeModal(); sendDotsPrompt(uid); } }
  ];
  if (currentUser.is_admin) items.push({ label: '🔨 Ban User', action: () => { closeModal(); el('tb-admin').click(); setTimeout(() => { if (el('ban-id')) el('ban-id').value = uid; }, 500); } });
  items.forEach(item => {
    const div = document.createElement('div'); div.className = 'ctx-item'; div.textContent = item.label;
    div.onclick = () => { root.innerHTML = ''; item.action(); };
    menu.appendChild(div);
  });
  root.appendChild(menu);
}
document.addEventListener('click', () => { const r = el('context-root'); if (r) r.innerHTML = ''; });

// --- مودال (ضربدر جدید) ---
function openModal(title, content) {
  const root = el('modal-root');
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal-card"><div class="modal-head"><div class="mt">${title}</div><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body">${content}</div></div></div>`;
}
function closeModal() { const r = el('modal-root'); if (r) r.innerHTML = ''; }

// --- استارت با نشست ذخیره‌شده (Auto-Login) ---
 (async function tryAutoLogin(){
  try {
    const tok = localStorage.getItem('dv_session');
    if (!tok) return;
    const { data: uid } = await sb.rpc('auth_uid_check', { p_token: tok });
    if (!uid) { localStorage.removeItem('dv_session'); return; }
    const { data: u } = await sb.from('app_users').select('*').eq('user_id', uid).single();
    if (u) { sessionToken = tok; u.password = null; currentUser = u; startApp(); }
  } catch(e) { console.error('Auto-login error', e); }
})();
  </script>
